          #include "solver.h"

          #include <cerrno>
          #include <cctype>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <exception>
          #include <iostream>
          #include <new>
          #include <string>
          #include <vector>

          namespace {

          class FastIntegerReader {
          public:
              explicit FastIntegerReader(std::FILE* input)
                  : input_(input)
              {
              }

              bool read_integer(int& value)
              {
                  int character = read_character();
                  while (true) {
                      while (character != EOF
                             && std::isspace(static_cast<unsigned char>(character)) != 0) {
                          character = read_character();
                      }
                      if (character == 'c') {
                          while (character != EOF && character != '\n') {
                              character = read_character();
                          }
                          character = read_character();
                          continue;
                      }
                      break;
                  }

                  if (character == EOF || character == '%') {
                      return false;
                  }

                  int sign = 1;
                  if (character == '-') {
                      sign = -1;
                      character = read_character();
                  }
                  if (character < '0' || character > '9') {
                      malformed_ = true;
                      return false;
                  }

                  int parsed = 0;
                  while (character >= '0' && character <= '9') {
                      parsed = parsed * 10 + (character - '0');
                      character = read_character();
                  }
                  value = parsed * sign;
                  return true;
              }

              bool malformed() const
              {
                  return malformed_;
              }

          private:
              int read_character()
              {
                  if (position_ == available_) {
                      available_ = std::fread(buffer_, 1, sizeof(buffer_), input_);
                      position_ = 0;
                      if (available_ == 0) {
                          return EOF;
                      }
                  }
                  return static_cast<unsigned char>(buffer_[position_++]);
              }

              std::FILE* input_ = nullptr;
              char buffer_[1 << 20] = {};
              std::size_t position_ = 0;
              std::size_t available_ = 0;
              bool malformed_ = false;
          };

          bool parse_header(std::FILE* input,
                            int& variable_count,
                            int& clause_count,
                            std::string& error)
          {
              char line[4096];
              while (std::fgets(line, sizeof(line), input) != nullptr) {
                  char* cursor = line;
                  while (*cursor != '\0'
                         && std::isspace(static_cast<unsigned char>(*cursor)) != 0) {
                      ++cursor;
                  }
                  if (*cursor == '\0' || *cursor == 'c') {
                      continue;
                  }
                  if (*cursor != 'p') {
                      error = "expected a DIMACS problem line";
                      return false;
                  }

                  char format[16] = {};
                  if (std::sscanf(cursor,
                                  "p %15s %d %d",
                                  format,
                                  &variable_count,
                                  &clause_count) != 3) {
                      error = "malformed DIMACS problem line";
                      return false;
                  }
                  if (std::strcmp(format, "cnf") != 0
                      || variable_count < 0
                      || clause_count < 0) {
                      error = "unsupported DIMACS problem line";
                      return false;
                  }
                  return true;
              }

              error = "missing DIMACS problem line";
              return false;
          }

          bool parse_dimacs(const char* path,
                            Solver& solver,
                            std::string& error)
          {
              std::FILE* input = std::fopen(path, "rb");
              if (input == nullptr) {
                  error = std::string("cannot open input: ") + std::strerror(errno);
                  return false;
              }

              int variable_count = 0;
              int declared_clause_count = 0;
              if (!parse_header(input,
                                variable_count,
                                declared_clause_count,
                                error)) {
                  std::fclose(input);
                  return false;
              }
              if (!solver.reserve_variables(variable_count)) {
                  error = "invalid variable count";
                  std::fclose(input);
                  return false;
              }

              FastIntegerReader reader(input);
              std::vector<int> clause;
              int parsed_clause_count = 0;
              int literal = 0;
              while (reader.read_integer(literal)) {
                  if (literal != 0) {
                      clause.push_back(literal);
                      continue;
                  }

                  if (!solver.add_clause(clause)) {
                      clause.clear();
                      ++parsed_clause_count;
                      continue;
                  }
                  clause.clear();
                  ++parsed_clause_count;
              }
              std::fclose(input);

              if (reader.malformed()) {
                  error = "malformed integer in DIMACS body";
                  return false;
              }
              if (!clause.empty()) {
                  error = "unterminated DIMACS clause";
                  return false;
              }
              if (parsed_clause_count != declared_clause_count) {
                  error = "DIMACS clause count mismatch";
                  return false;
              }
              return true;
          }

          double read_timeout_seconds()
          {
              const char* value = std::getenv("UATU_TIMEOUT_SEC");
              if (value == nullptr || *value == '\0') {
                  return 0.0;
              }

              char* end = nullptr;
              double timeout = std::strtod(value, &end);
              if (end == value || timeout < 0.0) {
                  return 0.0;
              }
              return timeout;
          }

          bool environment_enabled(const char* name)
          {
              const char* value = std::getenv(name);
              return value != nullptr
                  && *value != '\0'
                  && std::strcmp(value, "0") != 0;
          }

          void print_stats(const SolverStats& stats)
          {
              std::cout << "c decisions " << stats.decisions << '\n';
              std::cout << "c propagations " << stats.propagations << '\n';
              std::cout << "c conflicts " << stats.conflicts << '\n';
              std::cout << "c restarts " << stats.restarts << '\n';
              std::cout << "c reductions " << stats.reductions << '\n';
              std::cout << "c learned_core " << stats.learned_core << '\n';
              std::cout << "c learned_tier2 " << stats.learned_tier2 << '\n';
              std::cout << "c learned_local " << stats.learned_local << '\n';
              std::cout << "c tier_promotions " << stats.tier_promotions << '\n';
              std::cout << "c tier2_demotions " << stats.tier2_demotions << '\n';
              std::cout << "c deleted_local " << stats.deleted_local << '\n';
          }

          void print_model(const Solver& solver)
          {
              const std::vector<std::int8_t>& assignment = solver.assignment();
              for (int variable = 0; variable < solver.variable_count(); ++variable) {
                  int literal = variable + 1;
                  if (assignment[variable] < 0) {
                      literal = -literal;
                  }
                  std::cout << literal << ' ';
              }
              std::cout << "0\n";
          }

          }

          int main(int argc, char** argv)
          {
              if (argc != 2) {
                  std::cerr << "usage: uatu_solver <instance.cnf>\n";
                  return 1;
              }

              try {
                  Solver solver;
                  std::string error;
                  if (!parse_dimacs(argv[1], solver, error)) {
                      std::cerr << "error: " << error << '\n';
                      return 1;
                  }

                  SolveResult result = solver.solve(read_timeout_seconds());
                  if (result == SolveResult::SATISFIABLE) {
                      std::cout << "SATISFIABLE\n";
                  } else if (result == SolveResult::UNSATISFIABLE) {
                      std::cout << "UNSATISFIABLE\n";
                  } else {
                      std::cout << "UNSOLVED\n";
                  }

                  if (environment_enabled("UATU_PRINT_STATS")) {
                      print_stats(solver.stats());
                  }
                  if (result == SolveResult::SATISFIABLE
                      && environment_enabled("UATU_PRINT_MODEL")) {
                      print_model(solver);
                  }
                  return 0;
              } catch (const std::bad_alloc&) {
                  std::cerr << "error: memory allocation failed\n";
                  std::cout << "UNSOLVED\n";
                  return 1;
              } catch (const std::exception& exception) {
                  std::cerr << "error: " << exception.what() << '\n';
                  return 1;
              }
          }
