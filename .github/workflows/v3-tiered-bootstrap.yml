          total_learned = 0
          for item in selected:
              compressed_path = pool_directory / f"{item['hash']}.cnf.xz"
              cnf_path = pool_directory / f"{item['hash']}.cnf"
              model_path = pool_directory / f"{item['hash']}.minisat.model"

              print(f"Downloading index {item['index']} {item['hash']}", flush=True)
              urllib.request.urlretrieve(item['url'], compressed_path)
              with cnf_path.open('wb') as output:
                  decompression = subprocess.run(
                      ['xz', '-dc', str(compressed_path)],
                      stdout=output,
                      check=False,
                  )
              if decompression.returncode != 0:
                  raise SystemExit(f"xz failed for index {item['index']}")

              environment = os.environ.copy()
              environment['UATU_TIMEOUT_SEC'] = str(timeout_seconds)
              environment['UATU_PRINT_MODEL'] = '1'
              environment['UATU_PRINT_STATS'] = '1'
              uatu_rc, uatu_output, uatu_wall = run_command(
                  ['cpu/ver_5/obj/uatu_solver', str(cnf_path)],
                  environment,
              )
              uatu_result = parse_result(uatu_output)
              uatu_model_valid = True
              if uatu_result == 'sat':
                  uatu_model_valid = verify_model(
                      cnf_path,
                      parse_numeric_model(uatu_output),
                  )
              for line in uatu_output.splitlines():
                  if line.startswith('c learned_'):
                      total_learned += int(line.split()[-1])

              minisat_rc, minisat_output, minisat_wall = run_command([
                  'minisat',
                  '-verb=0',
                  f'-cpu-lim={timeout_seconds}',
                  str(cnf_path),
                  str(model_path),
              ])
              minisat_result = parse_result(minisat_output)
              minisat_model_valid = True
              if minisat_result == 'sat':
                  minisat_model_valid = verify_model(
                      cnf_path,
                      parse_minisat_model(model_path),
                  )

              uatu_correct = (
                  uatu_result == item['expected'] and uatu_model_valid
              )
              minisat_correct = (
                  minisat_result == item['expected'] and minisat_model_valid
              )
              result_rows.append({
                  'index': item['index'],
                  'expected': item['expected'],
                  'hash': item['hash'],
                  'solver': 'ver5-tiered',
                  'result': uatu_result,
                  'correct': int(uatu_correct),
                  'model_valid': int(uatu_model_valid),
                  'wall_sec': f'{uatu_wall:.6f}',
                  'exit_code': uatu_rc,
              })
              result_rows.append({
                  'index': item['index'],
                  'expected': item['expected'],
                  'hash': item['hash'],
                  'solver': 'minisat',
                  'result': minisat_result,
                  'correct': int(minisat_correct),
                  'model_valid': int(minisat_model_valid),
                  'wall_sec': f'{minisat_wall:.6f}',
                  'exit_code': minisat_rc,
              })

              compressed_path.unlink(missing_ok=True)
              cnf_path.unlink(missing_ok=True)
              model_path.unlink(missing_ok=True)

              if not uatu_correct or not minisat_correct:
                  print(uatu_output[-4000:])
                  print(minisat_output[-4000:])
                  raise SystemExit(
                      f"validation failed at index {item['index']}: "
                      f"Uatu={uatu_result}, MiniSAT={minisat_result}, "
                      f"expected={item['expected']}"
                  )

          raw_path = Path('evaluation/ver5_tiered_10_raw.csv')
          with raw_path.open('w', newline='') as output:
              writer = csv.DictWriter(
                  output,
                  fieldnames=[
                      'index', 'expected', 'hash', 'solver', 'result',
                      'correct', 'model_valid', 'wall_sec', 'exit_code',
                  ],
              )
              writer.writeheader()
              writer.writerows(result_rows)

          uatu_rows = [row for row in result_rows if row['solver'] == 'ver5-tiered']
          minisat_rows = [row for row in result_rows if row['solver'] == 'minisat']
          lines = [
              '# V3 + Tiered Clause Management Smoke Validation',
              '',
              '- Dataset: 10 SAT Competition 2025 Main Track instances',
              '- Composition: 5 SAT and 5 UNSAT',
              '- Selection: fastest prior-correct instances from the fixed 100-instance evaluation',
              '- Timeout: 180 seconds per solver and instance',
              '- SAT results: independently checked against the emitted model',
              '- UNSAT results: checked against competition labels and MiniSAT',
              '',
              '| Solver | Correct | SAT | UNSAT | Total wall time (s) |',
              '|---|---:|---:|---:|---:|',
              (
                  f"| `ver5-tiered` | {sum(int(row['correct']) for row in uatu_rows)}/10 | "
                  f"{sum(row['expected'] == 'sat' and row['correct'] == 1 for row in uatu_rows)} | "
                  f"{sum(row['expected'] == 'unsat' and row['correct'] == 1 for row in uatu_rows)} | "
                  f"{sum(float(row['wall_sec']) for row in uatu_rows):.6f} |"
              ),
              (
                  f"| `minisat` | {sum(int(row['correct']) for row in minisat_rows)}/10 | "
                  f"{sum(row['expected'] == 'sat' and row['correct'] == 1 for row in minisat_rows)} | "
                  f"{sum(row['expected'] == 'unsat' and row['correct'] == 1 for row in minisat_rows)} | "
                  f"{sum(float(row['wall_sec']) for row in minisat_rows):.6f} |"
              ),
              '',
              f'- Learned clauses observed across the 10 Uatu runs: {total_learned}',
              '',
              'Result: **PASS**',
              '',
          ]
          Path('evaluation/ver5_tiered_10_report.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Commit validated implementation and results
        run: |
          set -euo pipefail
          git config user.name 'Se-Min Lim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add cpu/ver_5 \
                  evaluation/ver5_tiered_10_manifest.csv \
                  evaluation/ver5_tiered_10_raw.csv \
                  evaluation/ver5_tiered_10_report.md
          git commit -m 'feat: implement V3 plus tiered clause management in Ver5'
          git push origin HEAD:temp/v3-tiered-evaluation

      - uses: actions/upload-artifact@v4
        with:
          name: v3-tiered-validation
          path: |
            evaluation/ver5_tiered_10_manifest.csv
            evaluation/ver5_tiered_10_raw.csv
            evaluation/ver5_tiered_10_report.md
          retention-days: 7
