          #!/usr/bin/env python3

          import argparse
          import itertools
          import os
          import random
          import subprocess
          import tempfile
          from pathlib import Path


          def brute_force(variable_count, clauses):
              for values in itertools.product((False, True), repeat=variable_count):
                  valid = True
                  for clause in clauses:
                      satisfied = False
                      for literal in clause:
                          value = values[abs(literal) - 1]
                          if value == (literal > 0):
                              satisfied = True
                              break
                      if not satisfied:
                          valid = False
                          break
                  if valid:
                      return True
              return False


          def write_cnf(path, variable_count, clauses):
              with path.open('w') as output:
                  output.write(f'p cnf {variable_count} {len(clauses)}\n')
                  for clause in clauses:
                      output.write(' '.join(str(value) for value in clause))
                      output.write(' 0\n')


          def parse_result(output):
              for line in output.splitlines():
                  if line == 'SATISFIABLE':
                      return 'sat'
                  if line == 'UNSATISFIABLE':
                      return 'unsat'
                  if line == 'UNSOLVED':
                      return 'unsolved'
              return 'error'


          def parse_model(output):
              model = []
              for line in output.splitlines():
                  fields = line.split()
                  if not fields or fields[-1] != '0':
                      continue
                  try:
                      values = [int(value) for value in fields]
                  except ValueError:
                      continue
                  if len(values) > 1:
                      model = values[:-1]
              return {abs(value): value > 0 for value in model if value != 0}


          def verify_model(variable_count, clauses, model):
              if len(model) < variable_count:
                  return False
              for clause in clauses:
                  if not any(model[abs(literal)] == (literal > 0)
                             for literal in clause):
                      return False
              return True


          def run_case(solver, variable_count, clauses, expected, directory, index):
              cnf_path = directory / f'case_{index}.cnf'
              write_cnf(cnf_path, variable_count, clauses)
              environment = os.environ.copy()
              environment['UATU_TIMEOUT_SEC'] = '10'
              environment['UATU_PRINT_MODEL'] = '1'
              completed = subprocess.run(
                  [solver, str(cnf_path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=15,
                  env=environment,
                  check=False,
              )
              result = parse_result(completed.stdout)
              if result != expected:
                  raise RuntimeError(
                      f'case {index}: expected {expected}, got {result}; '
                      f'stdout={completed.stdout!r}; stderr={completed.stderr!r}'
                  )
              if result == 'sat':
                  model = parse_model(completed.stdout)
                  if not verify_model(variable_count, clauses, model):
                      raise RuntimeError(f'case {index}: invalid SAT model')


          def generate_random_case(rng):
              variable_count = rng.randint(1, 8)
              clause_count = rng.randint(1, 28)
              clauses = []
              for _ in range(clause_count):
                  width = rng.randint(1, min(4, variable_count))
                  variables = rng.sample(range(1, variable_count + 1), width)
                  clause = [variable if rng.randrange(2) else -variable
                            for variable in variables]
                  clauses.append(clause)
              expected = 'sat' if brute_force(variable_count, clauses) else 'unsat'
              return variable_count, clauses, expected


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('--solver', required=True)
              parser.add_argument('--cases', type=int, default=80)
              arguments = parser.parse_args()

              fixed_cases = [
                  (1, [[1]], 'sat'),
                  (1, [[1], [-1]], 'unsat'),
                  (3, [[1], [-1, 2], [-2, 3]], 'sat'),
                  (2, [[1, 2], [-1, 2], [1, -2], [-1, -2]], 'unsat'),
                  (4, [[1, 2], [-1, 3], [-2, 3], [-3, 4]], 'sat'),
              ]

              rng = random.Random(20250830)
              cases = list(fixed_cases)
              for _ in range(arguments.cases):
                  cases.append(generate_random_case(rng))

              with tempfile.TemporaryDirectory() as temporary:
                  directory = Path(temporary)
                  for index, (variable_count, clauses, expected) in enumerate(cases):
                      run_case(
                          arguments.solver,
                          variable_count,
                          clauses,
                          expected,
                          directory,
                          index,
                      )
              print(f'validated {len(cases)} deterministic SAT/UNSAT cases')


          if __name__ == '__main__':
              main()
          EOF
