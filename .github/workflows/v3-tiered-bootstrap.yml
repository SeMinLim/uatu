          # Uatu CPU Ver5

          This experimental version is **V3 plus Tiered Clause Management**.

          It intentionally keeps the V3-style VSIDS decision policy and first-UIP
          learning. CHB and recursive learned-clause minimization are not enabled.

          Learned clauses are managed in three LBD-based tiers:

          - CORE: LBD at most 2. Retained permanently.
          - TIER2: LBD from 3 through 6. Retained while useful and demoted when stale.
          - LOCAL: LBD above 6. Periodically reduced by LBD, activity, and recency.

          A learned clause can be promoted when its observed LBD improves. Locked
          clauses and learned binary clauses are protected from deletion.
          EOF

