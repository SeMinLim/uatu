name: SAT Competition 2025 Baseline Evaluation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-uatu-eval.yml

concurrency:
  group: uatu-satcomp2025-evaluation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.indices }}
    steps:
      - name: Build deterministic 50-instance manifest
        id: matrix
        run: |
          set -euo pipefail
          curl -fsSL 'https://benchmark-database.de/getinstances?context=cnf&query=result%3Dsat%20and%20track%3Dmain_2025' -o sat.uri
          curl -fsSL 'https://benchmark-database.de/getinstances?context=cnf&query=result%3Dunsat%20and%20track%3Dmain_2025' -o unsat.uri
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          def read_urls(path):
              return sorted({line.strip() for line in Path(path).read_text().splitlines()
                             if line.strip().startswith('http')})

          def spread_sample(values, count):
              if len(values) < count:
                  raise SystemExit(f'only {len(values)} URLs available for {count} samples')
              indices = [round(i * (len(values) - 1) / (count - 1)) for i in range(count)]
              return [values[index] for index in indices]

          selected = []
          for status, path in [('sat', 'sat.uri'), ('unsat', 'unsat.uri')]:
              for url in spread_sample(read_urls(path), 25):
                  selected.append((status, url))

          selected.sort(key=lambda item: item[1])
          with open('satcomp2025_subset50.csv', 'w', newline='') as output:
              writer = csv.writer(output)
              writer.writerow(['index', 'expected', 'url'])
              for index, (status, url) in enumerate(selected):
                  writer.writerow([index, status, url])
          Path('matrix.json').write_text(json.dumps(list(range(50))))
          PY
          test "$(($(wc -l < satcomp2025_subset50.csv) - 1))" -eq 50
          echo "indices=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: satcomp2025-subset50
          path: satcomp2025_subset50.csv
          retention-days: 1

  baseline:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: satcomp2025-subset50

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisat xz-utils

      - name: Build Uatu ver_3
        run: make -C cpu/ver_3 clean all

      - name: Run one instance
        env:
          INDEX: ${{ matrix.index }}
          TIMEOUT_SEC: 1000
        run: |
          set -euo pipefail
          mkdir -p work result
          python3 - <<'PY' > selected.env
          import csv
          import os
          import shlex
          with open('satcomp2025_subset50.csv', newline='') as source:
              rows = list(csv.DictReader(source))
          row = rows[int(os.environ['INDEX'])]
          print('EXPECTED=' + shlex.quote(row['expected']))
          print('URL=' + shlex.quote(row['url']))
          PY
          source selected.env

          curl -fL --retry 6 --retry-delay 5 "$URL" -o work/instance.cnf.xz
          xz -t work/instance.cnf.xz
          xz -dc work/instance.cnf.xz > work/instance.cnf

          printf 'index,expected,solver,result,correct,wall_sec,user_sec,sys_sec,rss_kb,exit_code,url\n' > result/results.csv

          run_one() {
              local solver="$1"
              local command="$2"
              local output_file="work/${solver}.out"
              local time_file="work/${solver}.time"

              set +e
              /usr/bin/time -f '%e,%U,%S,%M' -o "$time_file" \
                  timeout --signal=TERM --kill-after=5s "${TIMEOUT_SEC}s" \
                  bash -lc "$command" > "$output_file" 2>&1
              local rc=$?
              set -e

              local result='error'
              if grep -q 'UNSATISFIABLE' "$output_file"; then
                  result='unsat'
              elif grep -q 'SATISFIABLE' "$output_file"; then
                  result='sat'
              elif [[ $rc -eq 124 || $rc -eq 137 || $rc -eq 143 ]]; then
                  result='timeout'
              fi

              local correct=0
              if [[ "$result" == "$EXPECTED" ]]; then correct=1; fi

              local wall='2000'
              local user='0'
              local sys='0'
              local rss='0'
              if [[ -s "$time_file" ]]; then
                  IFS=',' read -r wall user sys rss < "$time_file" || true
              fi
              printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
                  "$INDEX" "$EXPECTED" "$solver" "$result" "$correct" \
                  "$wall" "$user" "$sys" "$rss" "$rc" "$URL" >> result/results.csv
          }

          if (( INDEX % 2 == 0 )); then
              run_one 'minisat' "minisat -verb=0 work/instance.cnf /dev/null"
              run_one 'uatu_ver3' "UATU_TIMEOUT_SEC=${TIMEOUT_SEC} cpu/ver_3/obj/uatu_solver work/instance.cnf"
          else
              run_one 'uatu_ver3' "UATU_TIMEOUT_SEC=${TIMEOUT_SEC} cpu/ver_3/obj/uatu_solver work/instance.cnf"
              run_one 'minisat' "minisat -verb=0 work/instance.cnf /dev/null"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.index }}
          path: result/results.csv
          retention-days: 1

  aggregate:
    needs: baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: downloaded

      - uses: actions/download-artifact@v4
        with:
          name: satcomp2025-subset50
          path: downloaded/manifest

      - name: Aggregate and summarize
        run: |
          mkdir -p evaluation
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('downloaded').glob('baseline-*/results.csv'):
              with path.open(newline='') as source:
                  rows.extend(csv.DictReader(source))
          rows.sort(key=lambda row: (int(row['index']), row['solver']))
          if len(rows) != 100:
              raise SystemExit(f'expected 100 rows, found {len(rows)}')

          output_path = Path('evaluation/satcomp2025_subset50_baseline.csv')
          with output_path.open('w', newline='') as output:
              writer = csv.DictWriter(output, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)

          timeout = 1000.0
          summary = {}
          for solver in sorted({row['solver'] for row in rows}):
              selected = [row for row in rows if row['solver'] == solver]
              solved = [row for row in selected if row['correct'] == '1']
              par2_values = [min(float(row['wall_sec']), timeout)
                             if row['correct'] == '1' else 2.0 * timeout
                             for row in selected]
              summary[solver] = {
                  'solved': len(solved),
                  'sat': sum(row['correct'] == '1' and row['result'] == 'sat' for row in selected),
                  'unsat': sum(row['correct'] == '1' and row['result'] == 'unsat' for row in selected),
                  'par2': sum(par2_values) / len(par2_values),
                  'solved_time': sum(float(row['wall_sec']) for row in solved),
                  'errors': sum(row['result'] == 'error' for row in selected),
              }

          lines = [
              '# SAT Competition 2025 Subset Baseline',
              '',
              '- Instances: 50 deterministic spread samples (25 SAT, 25 UNSAT)',
              '- Timeout: 1,000 seconds per solver and instance',
              '- MiniSAT: Ubuntu package MiniSAT 2.2.1',
              '- Uatu: `cpu/ver_3` release build',
              '',
              '| Solver | Solved | SAT | UNSAT | PAR-2 (s) | Sum solved time (s) | Errors |',
              '|---|---:|---:|---:|---:|---:|---:|',
          ]
          for solver, data in summary.items():
              lines.append(f"| {solver} | {data['solved']} | {data['sat']} | {data['unsat']} | "
                           f"{data['par2']:.3f} | {data['solved_time']:.3f} | {data['errors']} |")
          Path('evaluation/satcomp2025_subset50_baseline.md').write_text('\n'.join(lines) + '\n')
          PY
          cp downloaded/manifest/satcomp2025_subset50.csv evaluation/

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/satcomp2025_subset50.csv \
                  evaluation/satcomp2025_subset50_baseline.csv \
                  evaluation/satcomp2025_subset50_baseline.md
          git commit -m 'eval: add MiniSAT and ver_3 SAT 2025 baseline'
          git push
