name: Launch Uatu Ver4 By Issue

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  launch:
    if: ${{ github.event.issue.title == '[uatu] launch ver4 evaluation' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and dispatch evaluation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat evaluation/ver4-workflow/part* | base64 -d | gzip -dc \
            > .github/workflows/uatu-ver4-evaluation.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/uatu-ver4-evaluation.yml')
          text = path.read_text()
          old = "on:\n  push:\n"
          new = "on:\n  workflow_dispatch:\n  push:\n"
          if old not in text:
              raise SystemExit('workflow trigger patch point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q '^name: Uatu Ver4' .github/workflows/uatu-ver4-evaluation.yml
          grep -q '^  workflow_dispatch:' .github/workflows/uatu-ver4-evaluation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add .github/workflows/uatu-ver4-evaluation.yml
          git commit -m 'eval: launch Uatu ver_4 evaluation'
          git push
          sleep 5
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/uatu-ver4-evaluation.yml/dispatches" \
            -f ref=main
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --comment 'Uatu Ver4 evaluation dispatched.'
