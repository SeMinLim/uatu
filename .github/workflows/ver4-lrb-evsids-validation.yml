name: Validate Uatu Ver4 LRB EVSIDS

on:
  push:
    branches:
      - temp/ver4-lrb-evsids-validation
    paths:
      - .validation/ver4-lrb-evsids/apply.py
      - .github/workflows/ver4-lrb-evsids-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select ten random SAT Competition 2025 benchmarks
        id: select
        run: |
          set -euo pipefail
          mkdir -p prepared
          curl -fL --retry 8 --retry-delay 5 \
            https://raw.githubusercontent.com/SeMinLim/uatu/7c9663f0e9fd88208ba82f9b301d295d378ed698/evaluation/ver5_full_vs_minisat_100_manifest.csv \
            -o prepared/source.csv
          python3 - <<'PY'
          import csv
          import json
          import os
          import random
          from pathlib import Path

          rows = list(csv.DictReader(Path('prepared/source.csv').open(newline='')))
          sat = [row for row in rows if row['expected'] == 'sat']
          unsat = [row for row in rows if row['expected'] == 'unsat']
          random.seed(20260904)
          selected = random.sample(sat, 5) + random.sample(unsat, 5)
          random.shuffle(selected)

          matrix = []
          for index, row in enumerate(selected):
              matrix.append({
                  'index': index,
                  'expected': row['expected'],
                  'hash': row['hash'],
                  'url': row['url'],
              })

          with Path('prepared/selected.csv').open('w', newline='') as output:
              writer = csv.DictWriter(
                  output,
                  fieldnames=['index', 'expected', 'hash', 'url'],
              )
              writer.writeheader()
              writer.writerows(matrix)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          print('selected 5 SAT and 5 UNSAT benchmarks')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ver4-lrb-evsids-manifest
          path: prepared/selected.csv
          retention-days: 7

  validate-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply LRB EVSIDS implementation
        run: python3 .validation/ver4-lrb-evsids/apply.py

      - name: Verify preserved Uatu search policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('cpu/ver_4/solver.cpp').read_text()
          reset = source[source.index('void Solver::resetRecentLBD()'):
                         source.index('// Rephase', source.index('void Solver::resetRecentLBD()'))]
          rephase = source[source.index('void Solver::rephase()'):
                           source.index('// Clause deletion', source.index('void Solver::rephase()'))]
          reduce = source[source.index('int Solver::reduce()'):
                          source.index('// Solver', source.index('int Solver::reduce()'))]
          assert 'backtrack(' not in reset
          assert 'backtrack(' not in rephase
          assert 'backtrack(0);' in reduce
          assert 'var_decay = 0.95;' in source
          assert 'update_score(variable, 0.5)' not in source
          assert 'Original second-stage bump' not in source
          PY

      - name: Build release debug and sanitizer binaries
        run: |
          set -euo pipefail
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          make -C cpu/ver_4 debug \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DUATU_PROFILE_BCP=0 \
            cpu/ver_4/solver.cpp cpu/ver_4/preprocess.cpp \
            cpu/ver_4/vivify.cpp cpu/ver_4/branching.cpp \
            cpu/ver_4/main.cpp -o cpu/ver_4/obj/uatu_solver_sanitize

      - name: Differentially validate random small CNFs
        run: |
          set -euo pipefail
          cat > /tmp/random_validate.py <<'PY'
          import itertools
          import os
          import random
          import subprocess
          import tempfile
          from pathlib import Path

          def expected_result(variable_count, clauses):
              for assignment in itertools.product((False, True), repeat=variable_count):
                  if all(any(assignment[abs(literal) - 1] == (literal > 0)
                             for literal in clause) for clause in clauses):
                      return 'SATISFIABLE'
              return 'UNSATISFIABLE'

          def validate_model(variable_count, clauses, output):
              model = None
              for line in output.splitlines():
                  fields = line.strip().split()
                  if not fields or fields[-1] != '0':
                      continue
                  try:
                      values = [int(field) for field in fields]
                  except ValueError:
                      continue
                  if len(values) == variable_count + 1:
                      model = values[:-1]
              if model is None:
                  raise RuntimeError('missing complete SAT model')
              assignment = {abs(literal): literal > 0 for literal in model}
              for clause in clauses:
                  if not any(assignment[abs(literal)] == (literal > 0)
                             for literal in clause):
                      raise RuntimeError('SAT model falsifies a clause')

          def run_solver(binary, path, variable_count, clauses, sanitizer):
              environment = os.environ.copy()
              environment['UATU_PRINT_MODEL'] = '1'
              environment['UATU_TIMEOUT_SEC'] = '10'
              if sanitizer:
                  environment['ASAN_OPTIONS'] = 'detect_leaks=0:halt_on_error=1:abort_on_error=1'
                  environment['UBSAN_OPTIONS'] = 'halt_on_error=1:print_stacktrace=1'
              completed = subprocess.run(
                  [binary, str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=20,
                  env=environment,
                  check=False,
              )
              if completed.returncode not in (10, 20):
                  raise RuntimeError(
                      f'bad exit {completed.returncode}:\n{completed.stdout}'
                  )
              if 'AddressSanitizer' in completed.stdout or 'runtime error:' in completed.stdout:
                  raise RuntimeError(completed.stdout)
              lines = {line.strip() for line in completed.stdout.splitlines()}
              if 'UNSATISFIABLE' in lines:
                  return 'UNSATISFIABLE'
              if 'SATISFIABLE' in lines:
                  validate_model(variable_count, clauses, completed.stdout)
                  return 'SATISFIABLE'
              raise RuntimeError('solver returned no result')

          random.seed(20260904)
          release = 'cpu/ver_4/obj/uatu_solver'
          sanitizer = 'cpu/ver_4/obj/uatu_solver_sanitize'
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              for trial in range(1000):
                  variable_count = random.randint(1, 8)
                  clause_count = random.randint(1, 30)
                  clauses = []
                  for _ in range(clause_count):
                      length = random.randint(1, min(variable_count, 6))
                      variables = random.sample(range(1, variable_count + 1), length)
                      clauses.append([
                          variable if random.getrandbits(1) else -variable
                          for variable in variables
                      ])
                  path = root / f'random-{trial}.cnf'
                  with path.open('w') as output:
                      output.write(f'p cnf {variable_count} {len(clauses)}\n')
                      for clause in clauses:
                          output.write(' '.join(map(str, clause)) + ' 0\n')
                  expected = expected_result(variable_count, clauses)
                  actual = run_solver(
                      release, path, variable_count, clauses, False
                  )
                  if actual != expected:
                      raise RuntimeError(
                          f'release mismatch {trial}: expected {expected}, got {actual}'
                      )
                  if trial < 250:
                      actual = run_solver(
                          sanitizer, path, variable_count, clauses, True
                      )
                      if actual != expected:
                          raise RuntimeError(
                              f'sanitizer mismatch {trial}: expected {expected}, got {actual}'
                          )
          print('validated 1000 release and 250 sanitizer CNFs')
          PY
          python3 /tmp/random_validate.py

      - name: Exercise LRB EVSIDS switching and LRB updates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          clauses = [(-1, 2)]
          variable_count = 100
          for variable in range(1, variable_count + 1):
              for offset in range(1, 7):
                  second = variable % variable_count + 1
                  third = (variable + offset) % variable_count + 1
                  fourth = (variable + offset + 17) % variable_count + 1
                  clauses.append((variable, third, fourth))
                  clauses.append((-variable, second, fourth))
          with Path('/tmp/hybrid.cnf').open('w') as output:
              output.write(f'p cnf {variable_count} {len(clauses)}\n')
              for clause in clauses:
                  output.write(' '.join(map(str, clause)) + ' 0\n')

          pigeons = 7
          holes = 6
          php = []
          variable = lambda p, h: p * holes + h + 1
          for pigeon in range(pigeons):
              php.append(tuple(variable(pigeon, hole) for hole in range(holes)))
          for pigeon in range(pigeons):
              for left in range(holes):
                  for right in range(left + 1, holes):
                      php.append((-variable(pigeon, left), -variable(pigeon, right)))
          for hole in range(holes):
              for left in range(pigeons):
                  for right in range(left + 1, pigeons):
                      php.append((-variable(left, hole), -variable(right, hole)))
          with Path('/tmp/php.cnf').open('w') as output:
              output.write(f'p cnf {pigeons * holes} {len(php)}\n')
              for clause in php:
                  output.write(' '.join(map(str, clause)) + ' 0\n')
          PY

          UATU_BRANCH_PHASE_PROPAGATIONS=1 UATU_TIMEOUT_SEC=30 \
            cpu/ver_4/obj/uatu_solver /tmp/hybrid.cnf > /tmp/hybrid.log
          UATU_TIMEOUT_SEC=30 \
            cpu/ver_4/obj/uatu_solver /tmp/php.cnf > /tmp/php.log

          lrb_decisions=$(awk -F: '/^LRB Decisions/ {gsub(/[[:space:]]/, "", $2); print $2}' /tmp/hybrid.log)
          evsids_decisions=$(awk -F: '/^EVSIDS Decisions/ {gsub(/[[:space:]]/, "", $2); print $2}' /tmp/hybrid.log)
          switches=$(awk -F: '/^Branching Switches/ {gsub(/[[:space:]]/, "", $2); print $2}' /tmp/hybrid.log)
          updates=$(awk -F: '/^LRB Updates/ {gsub(/[[:space:]]/, "", $2); print $2}' /tmp/php.log)

          test "${lrb_decisions:-0}" -gt 0
          test "${evsids_decisions:-0}" -gt 0
          test "${switches:-0}" -gt 0
          test "${updates:-0}" -gt 0
          echo "hybrid path: LRB=${lrb_decisions}, EVSIDS=${evsids_decisions}, switches=${switches}"
          echo "LRB interval updates: ${updates}"

  validate-benchmarks:
    needs:
      - prepare
      - validate-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply and build Ver4
        run: |
          set -euo pipefail
          python3 .validation/ver4-lrb-evsids/apply.py
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DUATU_PROFILE_BCP=0 \
            cpu/ver_4/solver.cpp cpu/ver_4/preprocess.cpp \
            cpu/ver_4/vivify.cpp cpu/ver_4/branching.cpp \
            cpu/ver_4/main.cpp -o cpu/ver_4/obj/uatu_solver_sanitize

      - name: Download SAT Competition 2025 benchmark
        env:
          BENCHMARK_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          mkdir -p work result
          curl -fL --retry 8 --retry-delay 5 "$BENCHMARK_URL" \
            -o work/input.cnf.xz
          xz -t work/input.cnf.xz
          xz -dc work/input.cnf.xz > work/input.cnf

      - name: Run release and sanitizer validation
        env:
          INDEX: ${{ matrix.index }}
          EXPECTED: ${{ matrix.expected }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          cat > work/verify.py <<'PY'
          import sys
          from pathlib import Path

          expected, output_path, cnf_path = sys.argv[1:]
          text = Path(output_path).read_text(errors='replace')
          lines = {line.strip() for line in text.splitlines()}
          result = 'unsolved'
          if 'UNSATISFIABLE' in lines:
              result = 'unsat'
          elif 'SATISFIABLE' in lines:
              result = 'sat'
          if result != 'unsolved' and result != expected:
              raise SystemExit(f'wrong result: expected {expected}, got {result}')

          if result == 'sat':
              model = None
              for line in text.splitlines():
                  fields = line.strip().split()
                  if not fields or fields[-1] != '0':
                      continue
                  try:
                      values = [int(field) for field in fields]
                  except ValueError:
                      continue
                  if len(values) > 1:
                      model = values[:-1]
              if model is None:
                  raise SystemExit('missing SAT model')
              assignment = {abs(literal): literal > 0 for literal in model}
              clause = []
              with Path(cnf_path).open(errors='replace') as source:
                  for line in source:
                      stripped = line.strip()
                      if not stripped or stripped[0] in 'cp%':
                          continue
                      for token in stripped.split():
                          literal = int(token)
                          if literal == 0:
                              if not any(
                                  assignment.get(abs(item), False) == (item > 0)
                                  for item in clause
                              ):
                                  raise SystemExit('model falsifies original CNF')
                              clause.clear()
                          else:
                              clause.append(literal)
              if clause:
                  raise SystemExit('unterminated clause')
          print(result)
          PY

          set +e
          UATU_PRINT_MODEL=1 UATU_TIMEOUT_SEC=120 \
            timeout --signal=TERM --kill-after=10s 150s \
            cpu/ver_4/obj/uatu_solver work/input.cnf \
            > work/release.log 2>&1
          release_rc=$?
          set -e
          case "$release_rc" in 0|10|20|124|137|143) ;; *) cat work/release.log; exit 1 ;; esac
          if grep -Eq 'Segmentation fault|Illegal instruction|internal error:|terminate called' work/release.log; then
            cat work/release.log
            exit 1
          fi
          release_result=$(python3 work/verify.py "$EXPECTED" work/release.log work/input.cnf)

          set +e
          ASAN_OPTIONS='detect_leaks=0:halt_on_error=1:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          UATU_TIMEOUT_SEC=20 \
            timeout --signal=TERM --kill-after=10s 50s \
            cpu/ver_4/obj/uatu_solver_sanitize work/input.cnf \
            > work/sanitize.log 2>&1
          sanitize_rc=$?
          set -e
          case "$sanitize_rc" in 0|10|20|124|137|143) ;; *) cat work/sanitize.log; exit 1 ;; esac
          if grep -Eq 'AddressSanitizer|runtime error:|Segmentation fault|Illegal instruction|internal error:|terminate called' work/sanitize.log; then
            cat work/sanitize.log
            exit 1
          fi

          printf 'index,expected,hash,release_result,release_exit,sanitizer_exit,status\n' > result/result.csv
          printf '%s,%s,%s,%s,%s,%s,clean\n' \
            "$INDEX" "$EXPECTED" "$HASH" "$release_result" \
            "$release_rc" "$sanitize_rc" >> result/result.csv
          cat result/result.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ver4-lrb-evsids-result-${{ matrix.index }}
          path: result/result.csv
          if-no-files-found: error
          retention-days: 7

  package-source:
    needs:
      - prepare
      - validate-core
      - validate-benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply and package validated source
        run: |
          set -euo pipefail
          python3 .validation/ver4-lrb-evsids/apply.py
          make -C cpu/ver_4 clean
          mkdir -p collected package

      - uses: actions/download-artifact@v4
        with:
          pattern: ver4-lrb-evsids-result-*
          path: collected
          merge-multiple: false

      - name: Verify ten benchmark jobs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.csv'):
              with path.open(newline='') as source:
                  rows.extend(csv.DictReader(source))
          rows.sort(key=lambda row: int(row['index']))
          if len(rows) != 10:
              raise SystemExit(f'expected 10 benchmark results, found {len(rows)}')
          if {int(row['index']) for row in rows} != set(range(10)):
              raise SystemExit('duplicate or missing benchmark index')
          if any(row['status'] != 'clean' for row in rows):
              raise SystemExit('unclean benchmark result')
          with Path('package/benchmark-results.csv').open('w', newline='') as output:
              writer = csv.DictWriter(output, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          solved = sum(row['release_result'] in ('sat', 'unsat') for row in rows)
          print(f'validated 10 benchmark jobs; {solved} solved within 120 seconds')
          PY
          cp prepared-placeholder /dev/null 2>/dev/null || true
          tar -czf package/uatu-ver4-lrb-evsids-source.tar.gz README.md cpu/ver_4

      - uses: actions/download-artifact@v4
        with:
          name: ver4-lrb-evsids-manifest
          path: package

      - uses: actions/upload-artifact@v4
        with:
          name: uatu-ver4-lrb-evsids-validated-source
          path: package
          if-no-files-found: error
          retention-days: 7
