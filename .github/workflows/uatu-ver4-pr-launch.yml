name: Launch Uatu Ver4 From Evaluation PR

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  launch:
    if: ${{ github.head_ref == 'eval/ver4-trigger' }}
    runs-on: windows-latest
    steps:
      - name: Dispatch Ver4 source packaging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/workflows/package-ver4-source.yml/dispatches" -f ref=main
