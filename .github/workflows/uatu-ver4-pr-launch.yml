name: Launch Uatu Ver4 From Evaluation PR

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  launch:
    if: ${{ github.head_ref == 'eval/ver4-trigger' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch evaluation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/uatu-ver4-evaluation.yml/dispatches" \
            -f ref=main
