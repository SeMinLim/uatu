name: Cancel Stale Uatu Evaluation Runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/uatu-cancel-stale-runs.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded screening run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 31475677996; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
