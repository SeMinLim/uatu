name: Validate Uatu Ver4 LRB EVSIDS Matrix

on:
  push:
    branches:
      - temp/ver4-lrb-evsids-validation
    paths:
      - .github/workflows/ver4-lrb-evsids-benchmark-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select ten random SAT Competition 2025 benchmarks
        id: select
        run: |
          set -euo pipefail
          mkdir -p prepared
          curl -fL --retry 8 --retry-delay 5 \
            https://raw.githubusercontent.com/SeMinLim/uatu/7c9663f0e9fd88208ba82f9b301d295d378ed698/evaluation/ver5_full_vs_minisat_100_manifest.csv \
            -o prepared/source.csv
          python3 .validation/ver4-lrb-evsids/repair_validation.py
          python3 .validation/ver4-lrb-evsids/validate.py select \
            prepared/source.csv prepared/selected.csv
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          rows = list(csv.DictReader(Path('prepared/selected.csv').open(newline='')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(rows, separators=(',', ':')) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ver4-lrb-evsids-matrix-manifest
          path: prepared/selected.csv
          retention-days: 7

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and build Ver4
        run: |
          set -euo pipefail
          python3 .validation/ver4-lrb-evsids/apply.py
          python3 .validation/ver4-lrb-evsids/fix_tabs.py
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DUATU_PROFILE_BCP=0 \
            cpu/ver_4/solver.cpp cpu/ver_4/preprocess.cpp \
            cpu/ver_4/vivify.cpp cpu/ver_4/branching.cpp \
            cpu/ver_4/main.cpp -o cpu/ver_4/obj/uatu_solver_sanitize

      - name: Download benchmark
        env:
          URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          mkdir -p work result
          curl -fL --retry 8 --retry-delay 5 "$URL" -o work/input.cnf.xz
          xz -t work/input.cnf.xz
          xz -dc work/input.cnf.xz > work/input.cnf

      - name: Run release and sanitizer builds
        env:
          INDEX: ${{ matrix.index }}
          EXPECTED: ${{ matrix.expected }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          cat > work/verify.py <<'PY'
          import sys
          from pathlib import Path

          expected, output_path, cnf_path = sys.argv[1:]
          text = Path(output_path).read_text(errors='replace')
          lines = {line.strip() for line in text.splitlines()}
          result = 'unsolved'
          if 'UNSATISFIABLE' in lines:
              result = 'unsat'
          elif 'SATISFIABLE' in lines:
              result = 'sat'
          if result != 'unsolved' and result != expected:
              raise SystemExit(f'wrong result: expected {expected}, got {result}')

          if result == 'sat':
              variables = None
              with Path(cnf_path).open(errors='replace') as source:
                  for line in source:
                      if line.startswith('p '):
                          variables = int(line.split()[2])
                          break
              model = None
              for line in text.splitlines():
                  fields = line.strip().split()
                  if not fields or fields[-1] != '0':
                      continue
                  try:
                      values = [int(field) for field in fields]
                  except ValueError:
                      continue
                  if variables is not None and len(values) == variables + 1:
                      model = values[:-1]
              if model is None:
                  raise SystemExit('missing complete SAT model')
              assignment = {abs(literal): literal > 0 for literal in model}
              clause = []
              with Path(cnf_path).open(errors='replace') as source:
                  for line in source:
                      stripped = line.strip()
                      if not stripped or stripped[0] in 'cp%':
                          continue
                      for token in stripped.split():
                          literal = int(token)
                          if literal == 0:
                              if not any(
                                  assignment.get(abs(item), False) == (item > 0)
                                  for item in clause
                              ):
                                  raise SystemExit('SAT model falsifies original CNF')
                              clause.clear()
                          else:
                              clause.append(literal)
              if clause:
                  raise SystemExit('unterminated clause')
          print(result)
          PY

          set +e
          UATU_PRINT_MODEL=1 UATU_TIMEOUT_SEC=120 \
            timeout --signal=TERM --kill-after=10s 150s \
            cpu/ver_4/obj/uatu_solver work/input.cnf > work/release.log 2>&1
          release_exit=$?
          set -e
          case "$release_exit" in 0|10|20|124|137|143) ;; *) cat work/release.log; exit 1 ;; esac
          if grep -Eq 'Segmentation fault|Illegal instruction|internal error:|terminate called' work/release.log; then
            cat work/release.log
            exit 1
          fi
          release_result=$(python3 work/verify.py "$EXPECTED" work/release.log work/input.cnf)

          set +e
          ASAN_OPTIONS='detect_leaks=0:halt_on_error=1:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          UATU_TIMEOUT_SEC=20 \
            timeout --signal=TERM --kill-after=10s 50s \
            cpu/ver_4/obj/uatu_solver_sanitize work/input.cnf \
            > work/sanitize.log 2>&1
          sanitizer_exit=$?
          set -e
          case "$sanitizer_exit" in 0|10|20|124|137|143) ;; *) cat work/sanitize.log; exit 1 ;; esac
          if grep -Eq 'AddressSanitizer|runtime error:|Segmentation fault|Illegal instruction|internal error:|terminate called' work/sanitize.log; then
            cat work/sanitize.log
            exit 1
          fi

          printf 'index,expected,hash,release_result,release_exit,sanitizer_exit,status\n' > result/result.csv
          printf '%s,%s,%s,%s,%s,%s,clean\n' \
            "$INDEX" "$EXPECTED" "$HASH" "$release_result" \
            "$release_exit" "$sanitizer_exit" >> result/result.csv
          cat result/result.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ver4-lrb-evsids-matrix-result-${{ matrix.index }}
          path: result/result.csv
          if-no-files-found: error
          retention-days: 7

  package:
    needs:
      - prepare
      - validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Materialize validated source
        run: |
          set -euo pipefail
          python3 .validation/ver4-lrb-evsids/apply.py
          python3 .validation/ver4-lrb-evsids/fix_tabs.py
          make -C cpu/ver_4 clean
          mkdir -p collected package

      - uses: actions/download-artifact@v4
        with:
          pattern: ver4-lrb-evsids-matrix-result-*
          path: collected
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: ver4-lrb-evsids-matrix-manifest
          path: package

      - name: Verify results and package source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.csv'):
              with path.open(newline='') as source:
                  rows.extend(csv.DictReader(source))
          rows.sort(key=lambda row: int(row['index']))
          if len(rows) != 10:
              raise SystemExit(f'expected 10 results, found {len(rows)}')
          if {int(row['index']) for row in rows} != set(range(10)):
              raise SystemExit('duplicate or missing benchmark index')
          if any(row['status'] != 'clean' for row in rows):
              raise SystemExit('unclean result')
          with Path('package/benchmark-results.csv').open('w', newline='') as output:
              writer = csv.DictWriter(output, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          solved = sum(row['release_result'] in ('sat', 'unsat') for row in rows)
          print(f'validated 10 benchmarks; {solved} solved within 120 seconds')
          PY
          tar -czf package/uatu-ver4-lrb-evsids-source.tar.gz README.md cpu/ver_4

      - uses: actions/upload-artifact@v4
        with:
          name: uatu-ver4-lrb-evsids-matrix-source
          path: package
          if-no-files-found: error
          retention-days: 7
