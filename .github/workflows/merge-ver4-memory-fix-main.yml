name: Merge Ver4 memory fix to main

on:
  push:
    branches:
      - temp/ver4-vivification-vs-minisat-100
    paths:
      - .github/workflows/merge-ver4-memory-fix-main.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified source fix
        run: |
          set -euo pipefail
          git config user.name 'Se-Min Lim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git fetch origin f4414083a15464e2b68e6a4eec361f191c5373f0
          git cherry-pick f4414083a15464e2b68e6a4eec361f191c5373f0
      - name: Build with strict warnings
        run: |
          set -euo pipefail
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
      - name: Run SAT and UNSAT smoke tests
        run: |
          set -euo pipefail
          cat > /tmp/ver4-sat.cnf <<'EOF'
          p cnf 3 3
          1 2 0
          -1 3 0
          -2 3 0
          EOF
          cat > /tmp/ver4-unsat.cnf <<'EOF'
          p cnf 1 2
          1 0
          -1 0
          EOF
          set +e
          env UATU_TIMEOUT_SEC=10 UATU_PRINT_MODEL=1 \
            cpu/ver_4/obj/uatu_solver /tmp/ver4-sat.cnf > /tmp/ver4-sat.out 2>&1
          sat_rc=$?
          env UATU_TIMEOUT_SEC=10 \
            cpu/ver_4/obj/uatu_solver /tmp/ver4-unsat.cnf > /tmp/ver4-unsat.out 2>&1
          unsat_rc=$?
          set -e
          cat /tmp/ver4-sat.out
          cat /tmp/ver4-unsat.out
          [[ $sat_rc -eq 10 ]]
          [[ $unsat_rc -eq 20 ]]
          grep -qx 'SATISFIABLE' /tmp/ver4-sat.out
          grep -qx 'UNSATISFIABLE' /tmp/ver4-unsat.out
      - name: Push main
        run: |
          set -euo pipefail
          git push origin HEAD:main
