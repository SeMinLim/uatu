name: Audit Complete Root Sanity Results
on:
  push:
    branches: [temp/ver4-root-sanity-100-20260905]
    paths: [.github/workflows/root-sanity-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect every benchmark artifact explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, io, json, os, re, urllib.request, urllib.error, zipfile
          from pathlib import Path
          API = 'https://api.github.com/repos/SeMinLim/uatu'
          TOKEN = os.environ['GH_TOKEN']
          def request(url):
              return urllib.request.Request(url, headers={'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json', 'User-Agent': 'uatu-result-audit'})
          def list_artifacts(run):
              result = []
              for page in range(1, 20):
                  with urllib.request.urlopen(request(f'{API}/actions/runs/{run}/artifacts?per_page=100&page={page}'), timeout=60) as response:
                      data = json.load(response)
                  result.extend(data['artifacts'])
                  if len(result) >= data['total_count']:
                      return result
              raise RuntimeError('Artifact pagination did not terminate')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def download(item, destination):
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(request(f'{API}/actions/artifacts/{item["id"]}/zip'), timeout=60) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  with urllib.request.urlopen(error.headers['Location'], timeout=120) as response:
                      payload = response.read()
              digest = hashlib.sha256(payload).hexdigest()
              if item.get('digest'):
                  assert item['digest'] == 'sha256:' + digest, item['name']
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for entry in archive.infolist():
                      path = Path(entry.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      if not entry.is_dir():
                          target = destination / path
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(archive.read(entry))
              print('DOWNLOADED', item['id'], item['name'], digest, flush=True)
          tasks = []
          for run, prefix, folder in [(33957925983, 'root-sanity-case-', 'paired'), (33959442043, 'isolated-sanitizer-', 'rechecks')]:
              artifacts = list_artifacts(run)
              chosen = [item for item in artifacts if re.fullmatch(re.escape(prefix) + r'\d+', item['name']) and not item['expired']]
              assert len(chosen) == 100, (run, len(chosen), [item['name'] for item in artifacts])
              assert {int(item['name'][len(prefix):]) for item in chosen} == set(range(100))
              Path(f'{folder}-artifacts.json').write_text(json.dumps(chosen, indent=2))
              tasks.extend((item, Path(folder) / item['name']) for item in chosen)
              if folder == 'paired':
                  inputs = [item for item in artifacts if item['name'] == 'root-sanity-inputs']
                  assert len(inputs) == 1
                  tasks.append((inputs[0], Path('prepared')))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              for _ in executor.map(lambda task: download(*task), tasks):
                  pass
          for folder, filename in [('paired', 'result.json'), ('rechecks', 'sanitizer_result.json')]:
              paths = list(Path(folder).rglob(filename))
              records = [json.loads(path.read_text()) for path in paths]
              indices = {record['index'] for record in records}
              print('COLLECTION', folder, 'count', len(records), 'missing', sorted(set(range(100)) - indices), flush=True)
              assert len(records) == 100 and indices == set(range(100))
          PY
      - name: Independently recompute scores and inspect diagnostics
        run: |
          set -euo pipefail
          python3 sanity_temp/finalize.py
          python3 sanity_temp/check_counters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-sanity-complete-audit
          path: |
            final
            paired-artifacts.json
            rechecks-artifacts.json
          if-no-files-found: error
          retention-days: 7
