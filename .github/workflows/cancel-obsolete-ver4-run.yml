name: Cancel Obsolete Ver4 Evaluation

on:
  push:
    branches:
      - temp/ver4-final-vs-minisat-100
    paths:
      - .github/workflows/cancel-obsolete-ver4-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SeMinLim/uatu/actions/runs/33761880593/cancel
