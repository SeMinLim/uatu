name: Uatu Evaluation Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/uatu-eval-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose benchmark strata
        run: |
          set -euo pipefail
          mkdir -p evaluation
          : > evaluation/subset-query-diagnostic.txt
          for result in sat unsat; do
            for minisat in yes no; do
              file="${result}-${minisat}.uri"
              url="https://benchmark-database.de/getinstances?context=cnf&query=result%3D${result}%20and%20track%3Dmain_2025%20and%20minisat1m%3D${minisat}"
              curl -fsSL "$url" -o "$file"
              count=$(grep -cE '^https?://' "$file" || true)
              printf '%s minisat1m=%s: %s\n' "$result" "$minisat" "$count" \
                >> evaluation/subset-query-diagnostic.txt
            done
          done

      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add evaluation/subset-query-diagnostic.txt
          git commit -m 'eval: record final-subset strata counts'
          git push
