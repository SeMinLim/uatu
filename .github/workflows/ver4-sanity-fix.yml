name: Validate Ver4 Sanity Fixes
on:
  push:
    branches: [temp/ver4-sanity-fix-validation-20260905]
    paths:
      - .github/workflows/ver4-sanity-fix.yml
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef7ee281b770758a318329501d85061fc563b496
          fetch-depth: 0
      - name: Verify the exact committed source
        run: |
          test "$(git rev-parse HEAD)" = ef7ee281b770758a318329501d85061fc563b496
          git diff --exit-code
          sha256sum cpu/ver_4/solver.h cpu/ver_4/solver.cpp cpu/ver_4/main.cpp cpu/ver_4/tests/regression.py
      - name: Run sanitizers, counter boundaries, allocation injection, and brute-force checks
        run: |
          set -euo pipefail
          python3 cpu/ver_4/tests/regression.py --samples 500 --build-dir work --baseline 60e2f03e533d6d1c16995f119a876bae140bbdc5 2>&1 | tee regression.log
          make -C cpu/ver_4 release profile debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-regression-evidence
          path: |
            regression.log
            work/regression.json
          if-no-files-found: warn
          retention-days: 7
  original-input:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        index: [33, 34, 36, 39, 70]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef7ee281b770758a318329501d85061fc563b496
      - uses: actions/checkout@v4
        with:
          ref: 52a7cb0b5035ff3ccc05ddd861c0edec0dc7bed2
          path: harness
          sparse-checkout: sanity_fix
      - uses: actions/download-artifact@v4
        with:
          name: root-sanity-inputs
          path: prepared
          run-id: 33957925983
          github-token: ${{ github.token }}
      - name: Recheck the original failing input using the committed source
        run: |
          test "$(git rev-parse HEAD)" = ef7ee281b770758a318329501d85061fc563b496
          git diff --exit-code -- cpu/ver_4
          python3 harness/sanity_fix/real_case.py ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-original-input-${{ matrix.index }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
  report:
    needs: [regression, original-input]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: committed-regression-evidence
          path: regression
      - uses: actions/download-artifact@v4
        with:
          pattern: committed-original-input-*
          path: originals
      - name: Print completed verification evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          summaries = list(Path('regression').rglob('regression.json'))
          assert len(summaries) == 1
          regression = json.loads(summaries[0].read_text())
          rows = [json.loads(p.read_text()) for p in Path('originals').rglob('result.json')]
          assert len(rows) == 5
          assert {r['index'] for r in rows} == {33, 34, 36, 39, 70}
          assert all(r['all_checks_passed'] for r in rows)
          evidence = {'tested_commit': 'ef7ee281b770758a318329501d85061fc563b496',
                      'regression': regression, 'original_inputs': sorted(rows, key=lambda r: r['index']),
                      'scope': 'targeted regression checks; not a new 100-case PAR-2 evaluation'}
          print('COMMITTED_SOURCE_VERIFICATION_BEGIN')
          print(json.dumps(evidence, indent=2))
          print('COMMITTED_SOURCE_VERIFICATION_END')
          Path('verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: committed-source-verification
          path: verification.json
          retention-days: 7
