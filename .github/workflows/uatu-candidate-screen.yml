name: Uatu Fast Candidate Screening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/uatu-candidate-screen.yml

concurrency:
  group: uatu-candidate-screen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Build deterministic eight-instance tuning manifest
        run: |
          set -euo pipefail
          curl -fsSL 'https://benchmark-database.de/getinstances?context=cnf&query=result%3Dsat%20and%20track%3Dmain_2025' -o sat.uri
          curl -fsSL 'https://benchmark-database.de/getinstances?context=cnf&query=result%3Dunsat%20and%20track%3Dmain_2025' -o unsat.uri
          python3 - <<'PY'
          from pathlib import Path

          def read_urls(path):
              return sorted({line.strip() for line in Path(path).read_text().splitlines()
                             if line.strip().startswith('http')})

          def spread(values, count):
              if len(values) < count:
                  raise SystemExit(f'not enough instances: {len(values)} < {count}')
              if count == 1:
                  return [values[len(values) // 2]]
              indices = [round(i * (len(values) - 1) / (count - 1)) for i in range(count)]
              return [values[i] for i in indices]

          rows = []
          for status, path in [('sat', 'sat.uri'), ('unsat', 'unsat.uri')]:
              for url in spread(read_urls(path), 4):
                  rows.append((status, url))

          with open('manifest.csv', 'w') as output:
              output.write('index,status,url\n')
              for index, (status, url) in enumerate(rows):
                  output.write(f'{index},{status},{url}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-screen-manifest
          path: manifest.csv
          retention-days: 1

  screen:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fast-screen-manifest
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisat xz-utils time
      - name: Build Uatu variants
        run: |
          set -euo pipefail
          make -C cpu/ver_3 clean all
          python3 evaluation/uatu_candidate_patch.py cpu/ver_3 candidate
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O3 -DNDEBUG -march=native \
              -DUATU_PROFILE_BCP=0 -DUATU_REDUCE_BACKTRACK=1 \
              candidate/solver.cpp candidate/main.cpp -o candidate/uatu_bt
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O3 -DNDEBUG -march=native \
              -DUATU_PROFILE_BCP=0 -DUATU_REDUCE_BACKTRACK=0 \
              candidate/solver.cpp candidate/main.cpp -o candidate/uatu_nobt
      - name: Run candidate race
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          row="$(awk -F, -v idx="$INDEX" 'NR > 1 && $1 == idx { print; exit }' manifest.csv)"
          IFS=, read -r index expected url <<< "$row"
          mkdir -p work
          curl -fL --retry 5 --retry-delay 3 "$url" -o work/instance.cnf.xz
          xz -dc work/instance.cnf.xz > work/instance.cnf
          hash="$(printf '%s' "$url" | sed -E 's#.*file/([0-9a-f]+).*#\1#')"
          printf 'index,status,hash,solver,result,correct,wall,user,sys,rss_kb,exit_code\n' > "result-${INDEX}.csv"

          run_one() {
              local solver_name="$1"
              local command="$2"
              rm -f work/output.txt work/time.txt work/minisat.model
              set +e
              /usr/bin/time -f '%e,%U,%S,%M' -o work/time.txt \
                  timeout --signal=TERM --kill-after=5s 120s bash -lc "$command" \
                  > work/output.txt 2>&1
              local rc=$?
              set -e

              local result='TIMEOUT'
              if grep -q 'UNSATISFIABLE' work/output.txt; then
                  result='UNSAT'
              elif grep -q 'SATISFIABLE' work/output.txt; then
                  result='SAT'
              elif [[ $rc -ne 124 && $rc -ne 137 ]]; then
                  result='ERROR'
              fi

              local correct=0
              if [[ "${result,,}" == "$expected" ]]; then correct=1; fi
              local wall=120 user=120 sys=0 rss=0
              if [[ -s work/time.txt ]]; then
                  IFS=, read -r wall user sys rss < work/time.txt || true
              fi
              printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
                  "$index" "$expected" "$hash" "$solver_name" "$result" "$correct" \
                  "$wall" "$user" "$sys" "$rss" "$rc" >> "result-${INDEX}.csv"
          }

          configs=(
              minisat
              ver3
              decay_095
              no_backtrack
              recursive_32
              decay_no_backtrack
              decay_no_backtrack_recursive_32
          )
          offset=$(( INDEX % ${#configs[@]} ))
          for (( step=0; step<${#configs[@]}; step++ )); do
              config="${configs[$(( (offset + step) % ${#configs[@]} ))]}"
              case "$config" in
                  minisat)
                      run_one minisat "minisat -verb=0 work/instance.cnf work/minisat.model"
                      ;;
                  ver3)
                      run_one ver3 "UATU_TIMEOUT_SEC=120 cpu/ver_3/obj/uatu_solver work/instance.cnf"
                      ;;
                  decay_095)
                      run_one decay_095 "UATU_TIMEOUT_SEC=120 UATU_VAR_DECAY=0.95 candidate/uatu_bt work/instance.cnf"
                      ;;
                  no_backtrack)
                      run_one no_backtrack "UATU_TIMEOUT_SEC=120 candidate/uatu_nobt work/instance.cnf"
                      ;;
                  recursive_32)
                      run_one recursive_32 "UATU_TIMEOUT_SEC=120 UATU_RECURSIVE_MIN_BUDGET=32 candidate/uatu_bt work/instance.cnf"
                      ;;
                  decay_no_backtrack)
                      run_one decay_no_backtrack "UATU_TIMEOUT_SEC=120 UATU_VAR_DECAY=0.95 candidate/uatu_nobt work/instance.cnf"
                      ;;
                  decay_no_backtrack_recursive_32)
                      run_one decay_no_backtrack_recursive_32 "UATU_TIMEOUT_SEC=120 UATU_VAR_DECAY=0.95 UATU_RECURSIVE_MIN_BUDGET=32 candidate/uatu_nobt work/instance.cnf"
                      ;;
              esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fast-screen-${{ matrix.index }}
          path: result-${{ matrix.index }}.csv
          retention-days: 1

  aggregate:
    needs: screen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-screen-*
          path: raw
          merge-multiple: true
      - name: Summarize screening
        run: |
          mkdir -p evaluation
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          rows = []
          for path in sorted(Path('raw').glob('result-*.csv')):
              with path.open() as stream:
                  rows.extend(csv.DictReader(stream))
          if len(rows) != 56:
              raise SystemExit(f'expected 56 rows, got {len(rows)}')

          rows.sort(key=lambda row: (int(row['index']), row['solver']))
          output = Path('evaluation/satcomp2025_subset8_candidates.csv')
          with output.open('w', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          data = defaultdict(lambda: {'solved': 0, 'wrong': 0, 'sat': 0, 'unsat': 0, 'par2': 0.0})
          for row in rows:
              entry = data[row['solver']]
              solved = row['correct'] == '1'
              if solved:
                  entry['solved'] += 1
                  entry[row['status']] += 1
                  entry['par2'] += min(float(row['wall']), 120.0)
              else:
                  if row['result'] not in ('TIMEOUT', 'ERROR'):
                      entry['wrong'] += 1
                  entry['par2'] += 240.0

          ranking = sorted(data.items(), key=lambda item: (item[1]['wrong'], -item[1]['solved'], item[1]['par2']))
          lines = [
              '# SAT Competition 2025 Fast Candidate Screening',
              '',
              '- Instances: 8 deterministic tuning instances (4 SAT, 4 UNSAT)',
              '- Timeout: 120 seconds per configuration',
              '- Ranking: zero wrong answers, solved count, then PAR-2',
              '',
              '| Rank | Solver | Solved | SAT | UNSAT | Wrong | PAR-2 |',
              '|---:|---|---:|---:|---:|---:|---:|',
          ]
          for rank, (solver, entry) in enumerate(ranking, 1):
              lines.append(f"| {rank} | `{solver}` | {entry['solved']} | {entry['sat']} | {entry['unsat']} | {entry['wrong']} | {entry['par2']:.2f} |")
          Path('evaluation/satcomp2025_subset8_candidates.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit screening result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add evaluation/satcomp2025_subset8_candidates.csv evaluation/satcomp2025_subset8_candidates.md
          git commit -m 'eval: record fast candidate screening'
          git push
