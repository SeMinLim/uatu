name: Uatu ver5 stage2 LBD versus MiniSAT PAR2 100
on:
  push:
    branches: [main]
    paths: [.github/workflows/uatu-ver5-lbd-par2-100.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: uatu-ver5-lbd-par2-100
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      indices: ${{ steps.sample.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8eb756b7284053522bd2314f17a2a1cf8c567fe1
      - name: Build the exact requested source and install MiniSAT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisat
          test "$(git rev-parse HEAD)" = 8eb756b7284053522bd2314f17a2a1cf8c567fe1
          make -C cpu/ver_5 release
          mkdir -p tools prepared
          cp cpu/ver_5/obj/uatu_solver tools/ver5
          cp /usr/bin/minisat tools/minisat
          curl -fL --retry 3 --max-time 120 https://raw.githubusercontent.com/SeMinLim/uatu/4ad27309a7eb89244446a8e02aad80e4b4c5a04a/ver5_work/evaluate.py -o tools/evaluate.py
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          source = {'commit': '8eb756b7284053522bd2314f17a2a1cf8c567fe1',
                    'files': {str(p): digest(p) for p in sorted(Path('cpu/ver_5').glob('*')) if p.is_file()}}
          Path('tools/source-manifest.json').write_text(json.dumps(source, indent=2) + '\n')
          evaluator = Path('tools/evaluate.py').read_text()
          evaluator = evaluator.replace("verified = not summary['ver5']['bugs']", "verified = not summary['ver5']['bugs'] and not summary['minisat']['bugs']")
          evaluator = evaluator.replace('code_validation_passed=verified', 'no_detected_runtime_or_answer_errors=verified')
          evaluator = evaluator.replace("raise RuntimeError('Ver5 failed code validation; source publication is blocked')", "raise RuntimeError('Runtime or answer errors detected; consult the complete recorded results')")
          Path('tools/evaluate.py').write_text(evaluator)
          compile(evaluator, 'tools/evaluate.py', 'exec')
          build = {'source_commit': source['commit'],
                   'source_manifest_sha256': digest('tools/source-manifest.json'),
                   'evaluator_sha256': digest('tools/evaluate.py'),
                   'binaries': {name: digest('tools/' + name) for name in ('ver5', 'minisat')},
                   'minisat_package': subprocess.check_output(['dpkg-query', '-W', 'minisat'], text=True).strip(),
                   'compiler': subprocess.check_output(['g++', '--version'], text=True),
                   'build_command': 'make -C cpu/ver_5 release',
                   'baseline_configuration': 'distribution MiniSAT, default preprocessing, -verb=0',
                   'timeout_sec': 1000, 'memory_limit_bytes': 12 * 1024**3,
                   'timing': 'external wall time including parsing and model output; model checking is outside timed solve',
                   'pairing': 'sequential runs on the same pinned CPU per instance; alternating solver order'}
          Path('tools/build.json').write_text(json.dumps(build, indent=2) + '\n')
          print('BUILD_IDENTITY=' + json.dumps(build), flush=True)
          PY
      - name: Uniform random sample without replacement from the official main-2025 manifest
        id: sample
        run: |
          python3 - <<'PY'
          import hashlib, html.parser, json, os, random, re, time, urllib.request
          from pathlib import Path
          SEED = 20260906
          URI = 'https://benchmark-database.de/getinstances?context=cnf&query=track%3Dmain_2025'
          PAGE = 'https://benchmark-database.de/?context=cnf&track=main_2025'
          def get(url):
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url, timeout=120) as response:
                          return response.read()
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
          raw = get(URI)
          page = get(PAGE)
          Path('prepared/track_main_2025.uri').write_bytes(raw)
          Path('prepared/metadata.html').write_bytes(page)
          urls = sorted(set(line.strip() for line in raw.decode().splitlines() if line.startswith(('http://', 'https://'))))
          assert len(urls) >= 100, ('insufficient official population', len(urls))
          population = []
          for url in urls:
              hashes = re.findall(r'(?<![0-9a-f])[0-9a-f]{32}(?![0-9a-f])', url)
              assert len(hashes) == 1, url
              population.append({'hash': hashes[0], 'url': url})
          assert len({row['hash'] for row in population}) == len(population)
          population.sort(key=lambda row: row['hash'])
          class TableParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None
              def handle_starttag(self, tag, attrs):
                  if tag == 'tr':
                      self.row = []
                  elif tag in ('td', 'th') and self.row is not None:
                      self.cell = []
              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell = None
                  elif tag == 'tr' and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
          parser = TableParser()
          parser.feed(page.decode())
          header = next(row for row in parser.rows if 'hash' in row and 'result' in row and 'filename' in row)
          metadata = {}
          for cells in parser.rows:
              if len(cells) == len(header):
                  record = dict(zip(header, cells))
                  if re.fullmatch('[0-9a-f]{32}', record.get('hash', '')):
                      metadata[record['hash']] = record
          assert all(row['hash'] in metadata for row in population), 'metadata does not cover the official manifest'
          selected = random.Random(SEED).sample(population, 100)
          rows = []
          for index, row in enumerate(selected):
              info = metadata[row['hash']]
              expected = info['result'].strip().lower()
              assert expected in ('sat', 'unsat', 'unknown'), info
              rows.append(dict(row, index=index, expected=expected, filename=info['filename'], family=info['family']))
          Path('prepared/manifest.json').write_text(json.dumps(rows, indent=2) + '\n')
          provenance = {'population_source': URI, 'metadata_source': PAGE, 'track': 'main_2025',
                        'population_count': len(population), 'sample_count': 100, 'seed': SEED,
                        'method': 'Python random.Random(seed).sample(population sorted by GBD hash, 100)',
                        'filtered_by_size_difficulty_or_result': False,
                        'population_sha256': hashlib.sha256(raw).hexdigest(),
                        'sample_sha256': hashlib.sha256(Path('prepared/manifest.json').read_bytes()).hexdigest()}
          Path('prepared/sampling.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print('SAMPLING=' + json.dumps(provenance), flush=True)
          print('SAMPLED_INSTANCES=' + json.dumps(rows), flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('indices=' + json.dumps(list(range(100))) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lbd-paired-tools
          path: tools
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: lbd-paired-manifest
          path: prepared
          retention-days: 7
  pair:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.indices) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lbd-paired-tools
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: lbd-paired-manifest
          path: prepared
      - name: Install baseline runtime dependencies and record resources
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisat
          lscpu
          free -h
          df -h .
      - name: Run the paired 1000-second measurements
        run: python3 tools/evaluate.py pair ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbd-pair-${{ matrix.index }}
          path: result
          if-no-files-found: error
          retention-days: 7
  aggregate:
    if: always()
    needs: [prepare, pair]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lbd-paired-tools
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: lbd-paired-manifest
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: lbd-pair-*
          path: collected
      - name: Require all 100 measured pairs and compute PAR-2
        run: |
          python3 tools/evaluate.py aggregate
      - name: Preserve provenance and a compact result table
        if: always()
        run: |
          mkdir -p summary
          cp tools/build.json tools/source-manifest.json prepared/manifest.json prepared/sampling.json summary/
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          source = Path('summary/raw.json')
          if source.exists():
              results = sorted(json.loads(source.read_text()), key=lambda row: row['index'])
              with Path('summary/results.csv').open('w', newline='') as stream:
                  writer = csv.writer(stream)
                  writer.writerow(['index', 'hash', 'filename', 'solver', 'status', 'answer', 'wall_sec', 'par2_sec', 'exit_code'])
                  for pair in results:
                      for row in sorted(pair['rows'], key=lambda row: row['solver']):
                          writer.writerow([pair['index'], pair['benchmark']['hash'], pair['benchmark']['filename'], row['solver'], row['status'], row['answer'], row['wall_sec'], row['wall_sec'] if row['status'] == 'solved' else 2000, row['exit_code']])
              print(Path('summary/results.csv').read_text(), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbd-paired-final
          path: summary
          if-no-files-found: error
          retention-days: 7
