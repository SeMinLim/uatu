name: Validate Ver4 Error Fix

on:
  push:
    branches:
      - temp/ver4-error-recheck
    paths:
      - .github/workflows/ver4-error-recheck-fixed.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - index: 0
            expected: sat
            hash: 00fd8ac9acd186a7a78a2c4d92f90de1
          - index: 69
            expected: sat
            hash: ee5fb3e181571740adb8444bd052dbdc
    steps:
      - uses: actions/checkout@v4
      - name: Build Ver4
        run: |
          set -euo pipefail
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -O3 -Wall -Wextra -Wpedantic -Werror'
      - name: Run prior error benchmark
        env:
          INDEX: ${{ matrix.index }}
          EXPECTED: ${{ matrix.expected }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          mkdir -p work result
          curl -fL --retry 8 --retry-delay 5 \
            "https://benchmark-database.de/file/${HASH}?context=cnf" \
            -o work/instance.cnf.xz
          xz -t work/instance.cnf.xz
          xz -dc work/instance.cnf.xz > work/instance.cnf

          total_mem_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          reserve_mem_kb=2097152
          if (( total_mem_kb > reserve_mem_kb + 1048576 )); then
            memory_limit_kb=$((total_mem_kb - reserve_mem_kb))
          else
            memory_limit_kb=$((total_mem_kb * 70 / 100))
          fi

          set +e
          /usr/bin/time -q -f '%e,%U,%S,%M' -o result/time.csv \
            timeout --signal=TERM --kill-after=5s 1010s \
            bash -lc "ulimit -v ${memory_limit_kb}; exec env UATU_TIMEOUT_SEC=1000 UATU_PRINT_MODEL=0 cpu/ver_4/obj/uatu_solver work/instance.cnf" \
            > result/solver.out 2>&1
          rc=$?
          set -e

          answer=error
          if grep -qx 'UNSATISFIABLE' result/solver.out; then
            answer=unsat
          elif grep -qx 'SATISFIABLE' result/solver.out; then
            answer=sat
          elif grep -qx 'UNSOLVED' result/solver.out || \
               [[ $rc -eq 124 || $rc -eq 137 || $rc -eq 143 ]]; then
            answer=timeout
          fi

          printf 'index=%s\nexpected=%s\nhash=%s\nanswer=%s\nexit_code=%s\n' \
            "$INDEX" "$EXPECTED" "$HASH" "$answer" "$rc" > result/status.txt
          printf 'compressed_bytes=%s\nuncompressed_bytes=%s\nmemory_limit_kb=%s\n' \
            "$(stat -c '%s' work/instance.cnf.xz)" \
            "$(stat -c '%s' work/instance.cnf)" \
            "$memory_limit_kb" >> result/status.txt
          cat result/status.txt
          cat result/time.csv
          tail -100 result/solver.out

          if [[ "$answer" == error ]]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ver4-error-fix-${{ matrix.index }}
          path: result
          if-no-files-found: error
          retention-days: 2
