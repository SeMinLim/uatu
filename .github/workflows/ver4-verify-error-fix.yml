name: Verify Ver4 error fix

on:
  push:
    branches:
      - temp/ver4-vivification-vs-minisat-100
    paths:
      - .github/workflows/ver4-verify-error-fix.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - index: 0
            expected: sat
            hash: 00fd8ac9acd186a7a78a2c4d92f90de1
            url: https://benchmark-database.de/file/00fd8ac9acd186a7a78a2c4d92f90de1?context=cnf
          - index: 69
            expected: sat
            hash: ee5fb3e181571740adb8444bd052dbdc
            url: https://benchmark-database.de/file/ee5fb3e181571740adb8444bd052dbdc?context=cnf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/ver4-vivification-vs-minisat-100
      - name: Build Ver4
        run: |
          set -euo pipefail
          make -C cpu/ver_4 clean all \
            CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
      - name: Run former error case
        run: |
          set -euo pipefail
          bash evaluation_temp/run_case.sh \
            '${{ matrix.index }}' '${{ matrix.expected }}' \
            '${{ matrix.hash }}' '${{ matrix.url }}'
          python3 - <<'PY'
          import csv
          from pathlib import Path

          row = next(csv.DictReader(Path('result/result.csv').open(newline='')))
          if row['result'] == 'error':
              raise SystemExit('solver still terminated with an error')
          print(f"verified result={row['result']} exit={row['exit_code']} rss_kb={row['rss_kb']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ver4-error-fix-${{ matrix.index }}
          path: |
            result
            work/ver4.out
            work/ver4.time
          if-no-files-found: error
          retention-days: 7
