name: Monitor Uatu Ver4 From Evaluation PR

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    if: ${{ github.head_ref == 'eval/ver4-trigger' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Print recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" \
            --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha,.created_at,.updated_at] | @tsv'
