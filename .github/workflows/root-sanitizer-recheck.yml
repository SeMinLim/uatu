name: Ver4 Root Sanity Isolated Sanitizer Recheck
on:
  push:
    branches:
      - temp/ver4-root-sanity-100-20260905
    paths:
      - .github/workflows/root-sanitizer-recheck.yml
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: root-sanity-inputs
          path: prepared
          run-id: 33957925983
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: root-sanity-binaries
          path: bin
          run-id: 33957925983
          github-token: ${{ github.token }}
      - name: Verify unchanged binaries and functional sanitizer startup
        run: |
          chmod +x bin/*
          sha256sum -c prepared/binaries.sha256
          python3 sanity_temp/sanitize_case.py probe
      - name: Use exactly the same 100 selected cases
        id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('prepared/manifest.json').read_text())
          assert len(rows) == 100 and {row['index'] for row in rows} == set(range(100))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps([{'index': row['index']} for row in rows]) + '\n')
          PY
  sanitize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: root-sanity-inputs
          path: prepared
          run-id: 33957925983
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: root-sanity-binaries
          path: bin
          run-id: 33957925983
          github-token: ${{ github.token }}
      - name: Check original Ver4 binary and run sanitizer
        run: |
          chmod +x bin/*
          sha256sum -c prepared/binaries.sha256
          python3 sanity_temp/sanitize_case.py '${{ matrix.index }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-sanitizer-${{ matrix.index }}
          path: sanitizer-result
          if-no-files-found: error
          retention-days: 7
  summarize:
    needs:
      - prepare
      - sanitize
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: isolated-sanitizer-*
          path: collected
      - name: Validate coverage and report actual diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          rows = [json.loads(path.read_text()) for path in Path('collected').rglob('sanitizer_result.json')]
          assert len(rows) == 100 and {row['index'] for row in rows} == set(range(100)), len(rows)
          assert all(row['completed'] for row in rows), [row for row in rows if not row['completed']]
          rows.sort(key=lambda row: row['index'])
          summary = {'benchmarks': 100, 'timeout_sec': 30,
                     'status_counts': dict(Counter(row['result']['status'] for row in rows)),
                     'startup_fixed_by': 'isolated parent with unlimited RLIMIT_AS; RSS watchdog retained',
                     'failures': [row for row in rows if row['result']['status'] not in ('sat', 'unsat', 'timeout')]}
          Path('summary').mkdir(exist_ok=True)
          Path('summary/sanitizer_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          Path('summary/sanitizer_cases.json').write_text(json.dumps(rows, indent=2) + '\n')
          print('ISOLATED_SANITIZER_SUMMARY_BEGIN')
          print(json.dumps(summary, indent=2))
          print('ISOLATED_SANITIZER_SUMMARY_END')
          for path in Path('collected').rglob('sanitizer_result.json'):
              row = json.loads(path.read_text())
              if row['result']['status'] not in ('sat', 'unsat', 'timeout'):
                  print('DIAGNOSTIC_INDEX', row['index'])
                  print((path.parent / 'sanitizer.log').read_text(errors='replace')[:16000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-sanitizer-summary
          path: summary
          if-no-files-found: error
          retention-days: 7
