name: Validate Uatu Ver5 Tiered Clause Management

on:
  push:
    branches:
      - temp/v3-tiered-evaluation
    paths:
      - .github/workflows/ver5-tiered-validation.yml

permissions:
  contents: write

concurrency:
  group: uatu-ver5-tiered-validation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/v3-tiered-evaluation
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisat

      - name: Replace Ver5 with V3 plus tiered clause management
        run: |
          set -euo pipefail
          rm -rf cpu/ver_5
          cp -a cpu/ver_3 cpu/ver_5

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:80]!r}')
              Path(path).write_text(text.replace(old, new, 1))

          def replace_region(path, start, end, replacement):
              text = Path(path).read_text()
              start_pos = text.find(start)
              if start_pos < 0:
                  raise SystemExit(f'missing start anchor in {path}: {start!r}')
              end_pos = text.find(end, start_pos)
              if end_pos < 0:
                  raise SystemExit(f'missing end anchor in {path}: {end!r}')
              Path(path).write_text(text[:start_pos] + replacement + text[end_pos:])

          header = 'cpu/ver_5/solver.h'
          source = 'cpu/ver_5/solver.cpp'
          main = 'cpu/ver_5/main.cpp'

          replace_once(
              header,
              '#define WatchedLiterals(id) (watched_literals[vars + id])\n\n\n// Heap data structure (max heap)',
              '#define WatchedLiterals(id) (watched_literals[vars + id])\n\n\nenum ClauseTier {\n'
              '\tCLAUSE_ORIGINAL = 0,\n'
              '\tCLAUSE_CORE = 1,\n'
              '\tCLAUSE_TIER2 = 2,\n'
              '\tCLAUSE_LOCAL = 3\n'
              '};\n\n\n// Heap data structure (max heap)'
          )
          replace_once(
              header,
              '\t// The number of conflict-analysis uses\n\tuint32_t useCount;\n    \t// Literals in a clause',
              '\t// The number of conflict-analysis uses\n'
              '\tuint32_t useCount;\n'
              '\t// Learned-clause retention tier\n'
              '\tint tier;\n'
              '\t// Last conflict where the clause participated in analysis\n'
              '\tint touched;\n'
              '    \t// Literals in a clause'
          )
          replace_once(
              header,
              '    \tClause( int sz ): lbd(0), activity(0.0), useCount(0) { literals.resize(sz); }',
              '    \tClause( int sz ): lbd(0), activity(0.0), useCount(0),\n'
              '\t                       tier(CLAUSE_ORIGINAL), touched(0) { literals.resize(sz); }'
          )
          replace_once(
              header,
              '    \tint rephase_inc, rephase_limit, reduce_limit;   // Parameters for rephase and reduce',
              '    \tint rephase_inc, rephase_limit, reduce_limit, reduceStep;\n'
              '\tint coreLBDLimit, tier2LBDLimit, tier2StaleLimit;'
          )
          replace_once(
              header,
              '\tlong long clauseActivityBumps, dynamicLBDUpdates;',
              '\tlong long clauseActivityBumps, dynamicLBDUpdates;\n'
              '\tlong long corePromotions, tier2Promotions, tier2Demotions;'
          )
          replace_once(
              header,
              '\tvoid update_score( int var, double coeff );               // Update variable activity\n'
              '\tvoid bumpClauseActivity( int cref );                       // Update learnt-clause activity',
              '\tvoid update_score( int var, double coeff );               // Update variable activity\n'
              '\tint  selectClauseTier( int lbd ) const;                    // Select tier from LBD\n'
              '\tvoid initializeLearnedClause( int cref, int lbd );         // Initialize learned-clause tier\n'
              '\tvoid updateClauseTier( int cref );                         // Promote a learned clause\n'
              '\tvoid bumpClauseActivity( int cref );                       // Update learnt-clause activity'
          )

          replace_once(
              source,
              '        clauseActivityBumps = dynamicLBDUpdates = 0;\n',
              '        clauseActivityBumps = dynamicLBDUpdates = 0;\n'
              '        corePromotions = tier2Promotions = tier2Demotions = 0;\n'
          )
          replace_once(
              source,
              '        rephase_inc = 100000;\n'
              '        rephase_limit = 100000;\n'
              '        reduce_limit = 8192;\n',
              '        rephase_inc = 100000;\n'
              '        rephase_limit = 100000;\n'
              '        reduce_limit = 8192;\n'
              '        reduceStep = 512;\n'
              '        coreLBDLimit = 3;\n'
              '        tier2LBDLimit = 6;\n'
              '        tier2StaleLimit = 30000;\n'
              '        if ( const char *env = getenv("UATU_REDUCE_INITIAL") ) {\n'
              '                const int parsed = atoi(env);\n'
              '                if ( parsed > 0 ) reduce_limit = parsed;\n'
              '        }\n'
              '        if ( const char *env = getenv("UATU_REDUCE_STEP") ) {\n'
              '                const int parsed = atoi(env);\n'
              '                if ( parsed > 0 ) reduceStep = parsed;\n'
              '        }\n'
              '        if ( const char *env = getenv("UATU_CORE_LBD") ) {\n'
              '                const int parsed = atoi(env);\n'
              '                if ( parsed > 0 ) coreLBDLimit = parsed;\n'
              '        }\n'
              '        if ( const char *env = getenv("UATU_TIER2_LBD") ) {\n'
              '                const int parsed = atoi(env);\n'
              '                if ( parsed >= coreLBDLimit ) tier2LBDLimit = parsed;\n'
              '        }\n'
              '        if ( const char *env = getenv("UATU_TIER2_STALE") ) {\n'
              '                const int parsed = atoi(env);\n'
              '                if ( parsed > 0 ) tier2StaleLimit = parsed;\n'
              '        }\n'
              '        if ( tier2LBDLimit < coreLBDLimit ) tier2LBDLimit = coreLBDLimit;\n'
          )
          replace_once(
              source,
              '        vsids.initialize(activity);\n'
              '        lbdMark[0] = 0;\n'
              '        for ( int i = 1; i <= vars; i ++ ) {\n'
              '                value[i] = local_best[i] = saved[i] = 0;\n'
              '                reason[i] = level[i] = mark[i] = 0;\n'
              '                lbdMark[i] = 0;\n'
              '                activity[i] = 0.0;\n'
              '                vsids.insert(i);\n'
              '        }',
              '        vsids.initialize(activity);\n'
              '        value[0] = local_best[0] = saved[0] = 0;\n'
              '        reason[0] = -1;\n'
              '        level[0] = mark[0] = 0;\n'
              '        lbdMark[0] = 0;\n'
              '        activity[0] = 0.0;\n'
              '        for ( int i = 1; i <= vars; i ++ ) {\n'
              '                value[i] = local_best[i] = saved[i] = 0;\n'
              '                reason[i] = -1;\n'
              '                level[i] = mark[i] = 0;\n'
              '                lbdMark[i] = 0;\n'
              '                activity[i] = 0.0;\n'
              '                vsids.insert(i);\n'
              '        }'
          )

          tier_methods = r'''// Select a learned-clause tier from its current LBD
          int Solver::selectClauseTier( int lbd ) const {
                  if ( lbd > 0 && lbd <= coreLBDLimit ) return CLAUSE_CORE;
                  if ( lbd > 0 && lbd <= tier2LBDLimit ) return CLAUSE_TIER2;
                  return CLAUSE_LOCAL;
          }

          // Initialize tier metadata for a newly learned clause
          void Solver::initializeLearnedClause( int cref, int lbd ) {
                  Clause &clause = clauseDB[cref];
                  clause.lbd = lbd;
                  clause.tier = selectClauseTier(lbd);
                  clause.touched = conflicts;
          }

          // Promote a learned clause when its dynamic LBD crosses a tier boundary
          void Solver::updateClauseTier( int cref ) {
                  Clause &clause = clauseDB[cref];
                  const int newTier = selectClauseTier(clause.lbd);
                  if ( newTier >= clause.tier ) return;

                  if ( newTier == CLAUSE_CORE ) {
                          ++corePromotions;
                  } else if ( newTier == CLAUSE_TIER2 ) {
                          ++tier2Promotions;
                  }
                  clause.tier = newTier;
          }

          '''
          tier_methods = tier_methods.replace('\n          ', '\n').lstrip()
          replace_once(
              source,
              '// Update learnt-clause activity\nvoid Solver::bumpClauseActivity',
              tier_methods + '// Update learnt-clause activity\nvoid Solver::bumpClauseActivity'
          )

          update_quality = r'''// Update learnt-clause usage, dynamic LBD, and tier
          void Solver::updateClauseQuality( int cref ) {
                  if ( cref < origin_clauses || cref >= static_cast<int>(clauseDB.size()) ) return;

                  bumpClauseActivity(cref);

                  Clause &clause = clauseDB[cref];
                  clause.touched = conflicts;
                  const int currentLBD = calculateClauseLBD(clause);
                  if ( currentLBD > 0 && (clause.lbd == 0 || currentLBD < clause.lbd) ) {
                          clause.lbd = currentLBD;
                          ++dynamicLBDUpdates;
                  }
                  updateClauseTier(cref);
          }

          '''
          update_quality = update_quality.replace('\n          ', '\n').lstrip()
          replace_region(
              source,
              '// Update learnt-clause usage and dynamic LBD\nvoid Solver::updateClauseQuality',
              '// Conflict analysis\nint Solver::analyze',
              update_quality
          )
          replace_once(
              source,
              '        // Preserve the original solver\'s conflict-level convention.\n'
              '        const int conflictLevel = level[abs(clauseDB[conflict][0])];',
              '        // First-UIP analysis always starts at the current decision level.\n'
              '        const int conflictLevel = static_cast<int>(decVarInTrail.size());'
          )
          replace_once(
              source,
              '                        if ( level[variable] >= conflictLevel ) ++unresolved;',
              '                        if ( level[variable] == conflictLevel ) ++unresolved;'
          )
          replace_once(
              source,
              '\t\t\tint v = abs(trail[i]);\n\t\t\tvalue[v] = 0;\n\n\t\t\t// Phase saving',
              '\t\t\tint v = abs(trail[i]);\n'
              '\t\t\tvalue[v] = 0;\n'
              '\t\t\treason[v] = -1;\n'
              '\t\t\tlevel[v] = 0;\n\n'
              '\t\t\t// Phase saving'
          )

          reduce_body = r'''// Tiered learned-clause reduction
          void Solver::reduce() {
                  backtrack(0);
                  reduces = 0;
                  reduce_limit += reduceStep;
                  ++reductionRuns;

                  const int oldSize = static_cast<int>(clauseDB.size());
                  reduceMap.assign(oldSize, -1);

                  std::vector<unsigned char> locked(oldSize, 0);
                  for ( int literal : trail ) {
                          const int clause = reason[abs(literal)];
                          if ( clause >= origin_clauses && clause < oldSize ) locked[clause] = 1;
                  }

                  std::vector<int> localCandidates;
                  localCandidates.reserve(oldSize - origin_clauses);
                  for ( int i = origin_clauses; i < oldSize; i ++ ) {
                          Clause &clause = clauseDB[i];
                          if ( locked[i] || clause.tier == CLAUSE_CORE ) continue;

                          if ( clause.tier == CLAUSE_TIER2 ) {
                                  const int age = conflicts - clause.touched;
                                  if ( age <= tier2StaleLimit ) continue;
                                  clause.tier = CLAUSE_LOCAL;
                                  ++tier2Demotions;
                          }

                          localCandidates.push_back(i);
                  }

                  std::sort(localCandidates.begin(), localCandidates.end(), [&]( int a, int b ) {
                          if ( clauseDB[a].activity != clauseDB[b].activity ) {
                                  return clauseDB[a].activity < clauseDB[b].activity;
                          }
                          if ( clauseDB[a].lbd != clauseDB[b].lbd ) {
                                  return clauseDB[a].lbd > clauseDB[b].lbd;
                          }
                          if ( clauseDB[a].literals.size() != clauseDB[b].literals.size() ) {
                                  return clauseDB[a].literals.size() > clauseDB[b].literals.size();
                          }
                          if ( clauseDB[a].touched != clauseDB[b].touched ) {
                                  return clauseDB[a].touched < clauseDB[b].touched;
                          }
                          return a < b;
                  });

                  std::vector<unsigned char> erase(oldSize, 0);
                  const size_t deleteCount = localCandidates.size() / 2;
                  for ( size_t i = 0; i < deleteCount; i ++ ) erase[localCandidates[i]] = 1;
                  deletedClauses += static_cast<long long>(deleteCount);

                  int newSize = origin_clauses;
                  for ( int i = 0; i < origin_clauses; i ++ ) reduceMap[i] = i;
                  for ( int i = origin_clauses; i < oldSize; i ++ ) {
                          if ( erase[i] ) continue;
                          if ( newSize != i ) clauseDB[newSize] = std::move(clauseDB[i]);
                          reduceMap[i] = newSize ++;
                  }
                  clauseDB.erase(clauseDB.begin() + newSize, clauseDB.end());

                  for ( int literal : trail ) {
                          const int variable = abs(literal);
                          if ( reason[variable] >= origin_clauses ) {
                                  reason[variable] = reduceMap[reason[variable]];
                          }
                  }

                  for ( int literal = -vars; literal <= vars; literal ++ ) {
                          if ( literal == 0 ) continue;
                          std::vector<WL> &watchers = WatchedLiterals(literal);
                          int out = 0;
                          for ( int i = 0; i < static_cast<int>(watchers.size()); i ++ ) {
                                  const int oldIndex = watchers[i].clauseIdx;
                                  const int newIndex = oldIndex < origin_clauses
                                          ? oldIndex : reduceMap[oldIndex];
                                  if ( newIndex == -1 ) continue;
                                  watchers[i].clauseIdx = newIndex;
                                  if ( out != i ) watchers[out] = watchers[i];
                                  ++out;
                          }
                          watchers.resize(out);
                  }
          }

          '''
          reduce_body = reduce_body.replace('\n          ', '\n').lstrip()
          replace_region(
              source,
              '// Clause deletion\nvoid Solver::reduce()',
              '// Solver\nint Solver::solve()',
              reduce_body
          )
          replace_once(
              source,
              '                                const int learnedClause = add_clause(learnt);\n'
              '                                clauseDB[learnedClause].lbd = lbd;\n'
              '                                assign(learnt[0], backtrackLevel, learnedClause);',
              '                                const int learnedClause = add_clause(learnt);\n'
              '                                initializeLearnedClause(learnedClause, lbd);\n'
              '                                assign(learnt[0], backtrackLevel, learnedClause);'
          )

          replace_once(
              main,
              '\tprintf( "----------------------------------------------------\\n" );\n'
              '\tprintf( "Conflicts            : %d\\n", solver.conflicts );',
              '\tsize_t coreClauses = 0;\n'
              '\tsize_t tier2Clauses = 0;\n'
              '\tsize_t localClauses = 0;\n'
              '\tfor ( int i = solver.origin_clauses;\n'
              '\t      i < static_cast<int>(solver.clauseDB.size()); i ++ ) {\n'
              '\t\tif ( solver.clauseDB[i].tier == CLAUSE_CORE ) coreClauses ++;\n'
              '\t\telse if ( solver.clauseDB[i].tier == CLAUSE_TIER2 ) tier2Clauses ++;\n'
              '\t\telse if ( solver.clauseDB[i].tier == CLAUSE_LOCAL ) localClauses ++;\n'
              '\t}\n\n'
              '\tprintf( "----------------------------------------------------\\n" );\n'
              '\tprintf( "Conflicts            : %d\\n", solver.conflicts );'
          )
          replace_once(
              main,
              '\tprintf( "Dynamic LBD Updates  : %lld\\n", solver.dynamicLBDUpdates );\n'
              '\tprintf( "Active Clauses       : %zu\\n", solver.clauseDB.size() );',
              '\tprintf( "Dynamic LBD Updates  : %lld\\n", solver.dynamicLBDUpdates );\n'
              '\tprintf( "Core Promotions      : %lld\\n", solver.corePromotions );\n'
              '\tprintf( "Tier2 Promotions     : %lld\\n", solver.tier2Promotions );\n'
              '\tprintf( "Tier2 Demotions      : %lld\\n", solver.tier2Demotions );\n'
              '\tprintf( "Core Clauses         : %zu\\n", coreClauses );\n'
              '\tprintf( "Tier2 Clauses        : %zu\\n", tier2Clauses );\n'
              '\tprintf( "Local Clauses        : %zu\\n", localClauses );\n'
              '\tprintf( "Active Clauses       : %zu\\n", solver.clauseDB.size() );'
          )

          Path('cpu/ver_5/README.md').write_text('''# Uatu Ver. 5

Tiered learned-clause management built directly on Ver. 3.

## Architecture

- Retains the Ver. 3 BCP, First-UIP learning, VSIDS branching, one-step minimization, and search-control pipeline.
- Keeps learned clauses with LBD at most 3 permanently in the CORE tier.
- Places learned clauses with LBD from 4 through 6 in TIER2 and protects them while they are used recently.
- Demotes TIER2 clauses that are unused for 30,000 conflicts to LOCAL.
- Deletes the lower-activity half of unlocked LOCAL clauses at each reduction.
- Promotes clauses when dynamic LBD improvement crosses a tier boundary.
- Does not enable CHB branching or recursive minimization.
''')

          root_readme = Path('README.md').read_text()
          version_anchor = '| `cpu/ver_2` | Improved solver preserving the original search policy, with lower profiling overhead, one-step learned-clause minimization, and deterministic clause reduction |\n'
          if version_anchor not in root_readme:
              raise SystemExit('missing root README version-table anchor')
          root_readme = root_readme.replace(
              version_anchor,
              version_anchor
              + '| `cpu/ver_3` | Usage-aware learned-clause retention with activity and dynamic LBD updates |\n'
              + '| `cpu/ver_4` | Ver. 3 with CHB decision selection |\n'
              + '| `cpu/ver_5` | Ver. 3 with CORE, TIER2, and LOCAL learned-clause management |\n',
              1
          )
          root_readme = root_readme.replace(
              'cd cpu/ver_1   # or cpu/ver_2',
              'cd cpu/ver_1   # or cpu/ver_2, cpu/ver_3, cpu/ver_4, or cpu/ver_5',
              1
          )
          Path('README.md').write_text(root_readme)
          PY

          test ! -e cpu/ver_5/chb.cpp
          test ! -e cpu/ver_5/chb.h
          test ! -e cpu/ver_5/recursive.cpp
          test ! -e cpu/ver_5/recursive.h
          grep -q 'CLAUSE_CORE' cpu/ver_5/solver.h
          grep -q 'CLAUSE_TIER2' cpu/ver_5/solver.h
          grep -q 'CLAUSE_LOCAL' cpu/ver_5/solver.h
          grep -q 'level\[variable\] == conflictLevel' cpu/ver_5/solver.cpp

      - name: Build release, debug, and sanitizer binaries
        run: |
          set -euo pipefail
          make -C cpu/ver_5 clean all \
              CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          make -C cpu/ver_5 debug \
              CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
              -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
              cpu/ver_5/solver.cpp cpu/ver_5/main.cpp \
              -o cpu/ver_5/obj/uatu_solver_sanitize

      - name: Differential correctness and sanitizer validation
        run: |
          set -euo pipefail
          mkdir -p validation/random
          python3 - <<'PY'
          import os
          import random
          import re
          import subprocess
          from pathlib import Path

          root = Path('validation/random')
          rng = random.Random(20250830)
          uatu = Path('cpu/ver_5/obj/uatu_solver_sanitize')

          def answer_from_output(text):
              if re.search(r'^UNSATISFIABLE$', text, re.MULTILINE):
                  return 'unsat'
              if re.search(r'^SATISFIABLE$', text, re.MULTILINE):
                  return 'sat'
              return 'unknown'

          def read_model(text):
              model = []
              for line in text.splitlines():
                  fields = line.split()
                  if not fields or fields[-1] != '0':
                      continue
                  try:
                      values = [int(value) for value in fields]
                  except ValueError:
                      continue
                  if len(values) > 1:
                      model = values[:-1]
              return model

          def verify_model(path, model):
              assignment = {abs(value): value > 0 for value in model if value}
              if not assignment:
                  return False
              clause = []
              for line in path.read_text().splitlines():
                  stripped = line.strip()
                  if not stripped or stripped[0] in 'cp%':
                      continue
                  for token in stripped.split():
                      literal = int(token)
                      if literal == 0:
                          if not any(
                              assignment.get(abs(item), False) == (item > 0)
                              for item in clause
                          ):
                              return False
                          clause.clear()
                      else:
                          clause.append(literal)
              return not clause

          for index in range(100):
              variables = rng.randint(4, 14)
              clauses = rng.randint(variables, variables * 6)
              rows = []
              for _ in range(clauses):
                  width = rng.randint(1, min(4, variables))
                  selected = rng.sample(range(1, variables + 1), width)
                  literal_row = [value if rng.getrandbits(1) else -value for value in selected]
                  rows.append(literal_row)

              cnf = root / f'random-{index:03d}.cnf'
              with cnf.open('w') as output:
                  output.write(f'p cnf {variables} {len(rows)}\n')
                  for row in rows:
                      output.write(' '.join(str(value) for value in row) + ' 0\n')

              model_path = root / f'minisat-{index:03d}.model'
              mini = subprocess.run(
                  ['minisat', '-verb=0', str(cnf), str(model_path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=10,
                  check=False,
              )
              expected = 'sat' if mini.returncode == 10 else 'unsat' if mini.returncode == 20 else 'unknown'
              if expected == 'unknown':
                  raise SystemExit(f'MiniSAT did not solve {cnf}: rc={mini.returncode}\n{mini.stdout}')

              env = os.environ.copy()
              env['ASAN_OPTIONS'] = 'detect_leaks=0:halt_on_error=1'
              env['UBSAN_OPTIONS'] = 'halt_on_error=1:print_stacktrace=1'
              env['UATU_TIMEOUT_SEC'] = '10'
              env['UATU_PRINT_MODEL'] = '1'
              if index >= 50:
                  env['UATU_REDUCE_INITIAL'] = '4'
                  env['UATU_REDUCE_STEP'] = '4'
                  env['UATU_CORE_LBD'] = '2'
                  env['UATU_TIER2_LBD'] = '4'
                  env['UATU_TIER2_STALE'] = '4'

              result = subprocess.run(
                  [str(uatu), str(cnf)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=15,
                  env=env,
                  check=False,
              )
              actual = answer_from_output(result.stdout)
              if actual != expected:
                  raise SystemExit(
                      f'Uatu mismatch for {cnf}: expected={expected}, actual={actual}, '
                      f'rc={result.returncode}\n{result.stdout}'
                  )
              if actual == 'sat' and not verify_model(cnf, read_model(result.stdout)):
                  raise SystemExit(f'invalid Uatu model for {cnf}\n{result.stdout}')

          Path('validation/implementation.txt').write_text(
              'release_build=pass\n'
              'debug_build=pass\n'
              'asan_ubsan_build=pass\n'
              'random_differential_cases=100\n'
              'random_differential_result=pass\n'
          )
          print('Validated 100 fixed-seed random CNFs against MiniSAT under ASan/UBSan')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tiered-implementation-validation
          path: validation/implementation.txt
          retention-days: 7

      - name: Commit implementation to the validation branch
        run: |
          set -euo pipefail
          git config user.name 'Se-Min Lim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add README.md cpu/ver_5
          git commit -m 'replace ver_5 with V3 tiered clause management'
          git push origin HEAD:temp/v3-tiered-evaluation

  benchmark:
    needs: implement
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - id: 18
            expected: unsat
            hash: 5c24cfeff639fefdead9a5641f65fa22
          - id: 21
            expected: sat
            hash: 69f6dd335626a9b71bfc6f2332f52b9d
          - id: 54
            expected: sat
            hash: 53c21f3e78f060883026b5a12ba691d8
          - id: 63
            expected: unsat
            hash: 8f391f2bf8167f1b96467f3479b33dc5
          - id: 70
            expected: sat
            hash: d89fc3e9c24e0383e940464f4704657e
          - id: 72
            expected: unsat
            hash: 09cd83e233380d0ba1fc56cee88367b1
          - id: 80
            expected: sat
            hash: 602c8a200227ab9d64d855164d35b5cf
          - id: 84
            expected: unsat
            hash: f6f91f6a44c3953b788c026cbbaa4e91
          - id: 92
            expected: sat
            hash: c86b261162cef181dc513963a8acb77f
          - id: 95
            expected: unsat
            hash: d971241ca861121371d20be1d61c15a3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/v3-tiered-evaluation

      - name: Install benchmark dependencies and build Ver5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils
          make -C cpu/ver_5 clean all \
              CXXFLAGS_COMMON='-std=c++17 -Wall -Wextra -Wpedantic -Werror'

      - name: Download SAT Competition 2025 benchmark
        env:
          BENCHMARK_HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          mkdir -p work result
          url="https://benchmark-database.de/file/${BENCHMARK_HASH}?context=cnf"
          curl -fL --retry 8 --retry-delay 5 "$url" -o work/instance.cnf.xz
          xz -t work/instance.cnf.xz
          xz -dc work/instance.cnf.xz > work/instance.cnf

      - name: Run and validate Ver5
        env:
          BENCHMARK_ID: ${{ matrix.id }}
          EXPECTED: ${{ matrix.expected }}
          BENCHMARK_HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -q -f '%e,%U,%S,%M' -o work/timing.csv \
              timeout --signal=TERM --kill-after=5s 310s \
              env UATU_TIMEOUT_SEC=300 UATU_PRINT_MODEL=1 \
              cpu/ver_5/obj/uatu_solver work/instance.cnf \
              > work/uatu.out 2>&1
          rc=$?
          set -e

          actual=unknown
          if grep -qx 'UNSATISFIABLE' work/uatu.out; then
              actual=unsat
          elif grep -qx 'SATISFIABLE' work/uatu.out; then
              actual=sat
          fi
          if [[ "$actual" != "$EXPECTED" ]]; then
              cat work/uatu.out
              printf 'Expected %s but received %s with exit code %s\n' "$EXPECTED" "$actual" "$rc"
              exit 1
          fi

          model_valid=1
          if [[ "$actual" == sat ]]; then
              python3 - work/uatu.out work/instance.cnf <<'PY'
          import sys

          output_path, cnf_path = sys.argv[1:]
          model = []
          for line in open(output_path, errors='ignore'):
              fields = line.split()
              if not fields or fields[-1] != '0':
                  continue
              try:
                  values = [int(value) for value in fields]
              except ValueError:
                  continue
              if len(values) > 1:
                  model = values[:-1]

          assignment = {abs(value): value > 0 for value in model if value}
          if not assignment:
              raise SystemExit('missing SAT model')

          clause = []
          with open(cnf_path, errors='ignore') as source:
              for line in source:
                  stripped = line.strip()
                  if not stripped or stripped[0] in 'cp%':
                      continue
                  for token in stripped.split():
                      literal = int(token)
                      if literal == 0:
                          if not any(
                              assignment.get(abs(item), False) == (item > 0)
                              for item in clause
                          ):
                              raise SystemExit('invalid SAT model')
                          clause.clear()
                      else:
                          clause.append(literal)
          if clause:
              raise SystemExit('unterminated DIMACS clause')
          PY
          fi

          IFS=',' read -r wall user sys rss < work/timing.csv
          stat_value() {
              local label="$1"
              grep -F "$label" work/uatu.out | tail -n 1 | awk -F: '{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}'
          }
          core=$(stat_value 'Core Clauses')
          tier2=$(stat_value 'Tier2 Clauses')
          local_count=$(stat_value 'Local Clauses')
          reductions=$(stat_value 'Clause Reductions')
          deleted=$(stat_value 'Deleted Clauses')
          core_promotions=$(stat_value 'Core Promotions')
          tier2_promotions=$(stat_value 'Tier2 Promotions')
          tier2_demotions=$(stat_value 'Tier2 Demotions')

          printf 'id,expected,result,correct,model_valid,wall_sec,user_sec,sys_sec,rss_kb,exit_code,hash,core,tier2,local,reductions,deleted,core_promotions,tier2_promotions,tier2_demotions\n' > result/result.csv
          printf '%s,%s,%s,1,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$BENCHMARK_ID" "$EXPECTED" "$actual" "$model_valid" \
              "$wall" "$user" "$sys" "$rss" "$rc" "$BENCHMARK_HASH" \
              "$core" "$tier2" "$local_count" "$reductions" "$deleted" \
              "$core_promotions" "$tier2_promotions" "$tier2_demotions" \
              >> result/result.csv
          cat result/result.csv

      - uses: actions/upload-artifact@v4
        with:
          name: tiered-smoke-${{ matrix.id }}
          path: result/result.csv
          retention-days: 7

  finalize:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/v3-tiered-evaluation
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: tiered-smoke-*
          path: downloaded
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: tiered-implementation-validation
          path: validation

      - name: Aggregate validation results
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('downloaded').glob('*/result.csv'):
              with path.open(newline='') as source:
                  rows.extend(csv.DictReader(source))
          rows.sort(key=lambda row: int(row['id']))
          if len(rows) != 10:
              raise SystemExit(f'expected 10 benchmark rows, found {len(rows)}')
          if any(row['correct'] != '1' or row['result'] != row['expected'] for row in rows):
              raise SystemExit('at least one SAT Competition benchmark failed validation')
          if sum(row['expected'] == 'sat' for row in rows) != 5:
              raise SystemExit('expected five SAT benchmarks')
          if sum(row['expected'] == 'unsat' for row in rows) != 5:
              raise SystemExit('expected five UNSAT benchmarks')

          fields = list(rows[0])
          with Path('evaluation/ver5_tiered_smoke10.csv').open('w', newline='') as output:
              writer = csv.DictWriter(output, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          total_wall = sum(float(row['wall_sec']) for row in rows)
          lines = [
              '# Uatu Ver5 Tiered Clause Management Validation',
              '',
              '- Implementation: Ver. 3 plus CORE, TIER2, and LOCAL learned-clause management',
              '- Isolation: VSIDS and one-step minimization retained; CHB and recursive minimization disabled',
              '- Static validation: release, debug, and ASan/UBSan builds passed with warnings treated as errors',
              '- Differential validation: 100 fixed-seed random CNFs matched MiniSAT; every SAT model was checked',
              '- Benchmark validation: 10 SAT Competition 2025 Main Track instances, five SAT and five UNSAT',
              '- Per-instance timeout: 300 seconds',
              '',
              '| ID | Expected | Result | Model | Wall (s) | CORE | TIER2 | LOCAL | Reductions | Deleted |',
              '|---:|---|---|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for row in rows:
              lines.append(
                  f"| {row['id']} | {row['expected']} | {row['result']} | "
                  f"{row['model_valid']} | {float(row['wall_sec']):.3f} | "
                  f"{row['core']} | {row['tier2']} | {row['local']} | "
                  f"{row['reductions']} | {row['deleted']} |"
              )
          lines += [
              '',
              '**Validation result: 10/10 correct.**',
              f'Aggregate solver wall time: **{total_wall:.3f} seconds**.',
              '',
          ]
          Path('evaluation/ver5_tiered_smoke10.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Publish verified implementation
        run: |
          set -euo pipefail
          rm .github/workflows/ver5-tiered-validation.yml
          git config user.name 'Se-Min Lim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add README.md cpu/ver_5 evaluation/ver5_tiered_smoke10.csv \
                  evaluation/ver5_tiered_smoke10.md \
                  .github/workflows/ver5-tiered-validation.yml
          git commit -m 'validate ver_5 tiered clause management on SAT 2025'
          git push origin HEAD:temp/v3-tiered-evaluation

      - uses: actions/upload-artifact@v4
        with:
          name: ver5-tiered-validation-results
          path: |
            evaluation/ver5_tiered_smoke10.csv
            evaluation/ver5_tiered_smoke10.md
          retention-days: 7
