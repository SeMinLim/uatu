name: Publish Controlled V3 Tiered Ver5 to Main

on:
  push:
    branches:
      - temp/v3-tiered-evaluation
    paths:
      - .github/workflows/v3-tiered-controlled-publish-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uatu-v3-tiered-controlled-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify controlled reconstruction evidence
        run: |
          set -euo pipefail
          git fetch origin main temp/v3-tiered-evaluation
          git checkout -B temp/v3-tiered-evaluation \
              origin/temp/v3-tiered-evaluation
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          completion = json.loads(
              Path('evaluation/ver5_tiered_10_complete.json').read_text()
          )
          lineage = json.loads(
              Path('evaluation/ver5_tiered_lineage.json').read_text()
          )
          required = {
              'variant': 'V3 + Tiered Clause Management',
              'construction': 'controlled feature-delta subtraction',
              'chb_enabled': False,
              'recursive_minimization_enabled': False,
              'tiered_clause_management_enabled': True,
              'sat_competition_2025_instances': 10,
              'ver5_correct': 10,
              'minisat_correct': 10,
              'strict_build': 'pass',
              'deterministic_tests': 'pass',
          }
          for key, expected in required.items():
              actual = completion.get(key)
              if actual != expected:
                  raise SystemExit(
                      f'completion mismatch: {key}={actual!r}, '
                      f'expected {expected!r}'
                  )
          if lineage.get('construction') != (
              'combined Ver5 donor minus independently measured '
              'V3+CHB and V3+Recursive-Minimization deltas'
          ):
              raise SystemExit('lineage construction does not match')
          if int(lineage.get('tier_keyword_hits', 0)) < 8:
              raise SystemExit('tiered-clause logic was not retained')

          manifest = list(csv.DictReader(
              Path('evaluation/ver5_tiered_10_manifest.csv').open(newline='')
          ))
          rows = list(csv.DictReader(
              Path('evaluation/ver5_tiered_10_raw.csv').open(newline='')
          ))
          if len(manifest) != 10 or len(rows) != 20:
              raise SystemExit('validation record has an unexpected size')
          if any(row['correct'] != '1' for row in rows):
              raise SystemExit('at least one validation row is incorrect')
          PY
          test ! -e cpu/ver_5/chb.cpp
          test ! -e cpu/ver_5/chb.h
          test ! -e cpu/ver_5/recursive.cpp
          test ! -e cpu/ver_5/recursive.h
          ! grep -R -n -E '\b(CHB|chb_[A-Za-z0-9_]*|recursiveMinimi[sz]e|recursive_minimi[sz]e)\b' \
              cpu/ver_5 --include='*.cpp' --include='*.h' --include='Makefile'
          make -C cpu/ver_5 clean all

      - name: Publish controlled Ver5 and validation records
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          rm -rf cpu/ver_5
          git checkout origin/temp/v3-tiered-evaluation -- \
              cpu/ver_5 \
              evaluation/ver5_tiered_10_manifest.csv \
              evaluation/ver5_tiered_10_raw.csv \
              evaluation/ver5_tiered_10_report.md \
              evaluation/ver5_tiered_10_complete.json \
              evaluation/ver5_tiered_lineage.json

          git config user.name 'Se-Min Lim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add cpu/ver_5 \
                  evaluation/ver5_tiered_10_manifest.csv \
                  evaluation/ver5_tiered_10_raw.csv \
                  evaluation/ver5_tiered_10_report.md \
                  evaluation/ver5_tiered_10_complete.json \
                  evaluation/ver5_tiered_lineage.json
          if git diff --cached --quiet; then
              echo 'Main already contains the controlled implementation.'
          else
              git commit -m 'feat: set Ver5 to controlled V3 plus tiered management'
              git push origin HEAD:main
          fi
